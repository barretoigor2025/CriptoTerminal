<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Diário · Cripto Terminal</title>
<style>
:root{color-scheme:dark;--bg:#0c1015;--panel:#121923;--line:#263241;--muted:#a0afc0;--up:#49e9ad;--down:#ff7189;--accent:#f4b95f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f4f7fb;font:16px system-ui,sans-serif}
main{width:min(1600px,100%);height:100dvh;margin:auto;padding:clamp(8px,2vw,24px);display:grid;grid-template-rows:auto auto minmax(130px,1fr) auto;gap:8px}
header,.chart-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a{color:#e3eaf3;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
a:hover{border-color:var(--accent)}
small,.muted{color:var(--muted)}
h1{font-size:clamp(1.45rem,4.8vh,3.5rem);margin:0;line-height:1}
h1 span{color:var(--accent)}
section{border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:clamp(8px,1.5vw,20px);min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px}
.price{font-size:clamp(1.55rem,3vw,3.1rem);font-weight:750;font-variant-numeric:tabular-nums}
.change{color:var(--tone,var(--muted));font-weight:750}
.chart-stage{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%}
dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
dt{color:var(--muted);font-size:.78rem}dd{margin:3px 0 0;font-weight:650;font-variant-numeric:tabular-nums;font-size:clamp(.82rem,1.4vw,1.13rem)}
.reaction{position:absolute;inset:0 0 0 auto;width:var(--reaction-width,40%);pointer-events:none}
.reaction .verdict-art{position:absolute;left:calc((var(--fight-size) - var(--reaction-size)) / 2);top:var(--reaction-top,50%);width:var(--reaction-size,100%);height:var(--reaction-size,100%);object-fit:contain;transform:translateY(-50%);filter:drop-shadow(0 0 22px var(--glow,#1c2938))}
.fight{position:absolute;top:var(--fight-top,0);left:0;width:var(--fight-size,100%);aspect-ratio:1;object-fit:contain;display:none}
[data-direction="up"] .fight-up,[data-direction="down"] .fight-down{display:block}
.speech{position:absolute;z-index:1;left:calc(var(--fight-size,100%) / 2);top:calc(var(--reaction-top,50%) - var(--reaction-size,100%) / 2 - 4px);transform:translate(-50%,-100%);display:none;width:max-content;max-width:calc(100% - 8px);padding:5px 9px;border:1px solid var(--tone,var(--muted));border-radius:12px;background:var(--panel);font-size:clamp(.72rem,2.2vw,1rem);line-height:1.15;text-align:center;font-weight:650}
.speech::after{content:"";position:absolute;top:100%;left:50%;width:6px;height:6px;transform:translate(-50%,-50%) rotate(45deg);background:var(--panel);border-right:1px solid var(--tone);border-bottom:1px solid var(--tone)}
[data-direction="up"] .speech-up,[data-direction="down"] .speech-down{display:block}
.verdict{color:var(--tone,var(--muted));font-weight:750;font-size:clamp(.78rem,2.8vw,1.35rem);text-align:right}
.chart-top{flex-wrap:nowrap;gap:8px}
.quote{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
[data-direction="up"]{--tone:var(--up);--glow:#153b33}
[data-direction="down"]{--tone:var(--down);--glow:#41232e}
#status{margin:0;font-size:.75rem}
</style>
<main id="dashboard">
<header><a href="index.html">← Cripto Terminal</a><small>BINANCE SPOT · BTC/USDT · 1D · UTC</small></header>
<h1><span>BTC</span> Diário</h1>
<section aria-label="Gráfico de Bitcoin">
<div class="chart-top"><div class="quote"><span id="price" class="price">—</span><span id="change" class="change">—</span></div><span id="verdict" class="verdict" aria-live="polite">Carregando candle…</span></div>
<div class="chart-stage">
<canvas id="chart" role="img" aria-label="Gráfico diário de Bitcoin"></canvas>
<div id="reaction" class="reaction" role="group" aria-label="Reação ao candle de hoje">
<img class="fight fight-up" src="assets/btc-diario/boxe-walter.webp" alt="Walter ataca com soco no ar, barrigada e perfume">
<img class="fight fight-down" src="assets/btc-diario/boxe-dr.webp" alt="Dr. ataca com soco, cabeçada e martelada cômica">
<span class="speech speech-up">Aiiinnn... A contagem</span>
<span class="speech speech-down">Aóóóóó</span>
<img class="verdict-art" id="up" hidden src="assets/btc-diario/walter.webp" alt="Walter ri e aponta para o Dr., que está de joelhos">
<img class="verdict-art" id="down" hidden src="assets/btc-diario/dr.webp" alt="Dr. comemora com uma placa de acerto enquanto Walter fica furioso">
</div>
</div>
<dl><div><dt>Abertura</dt><dd id="open">—</dd></div><div><dt>Máxima</dt><dd id="high">—</dd></div><div><dt>Mínima</dt><dd id="low">—</dd></div></dl>
</section>
<p id="status" class="muted" role="status">Buscando dados da Binance…</p>
</main>
<script>
const element = id => document.getElementById(id);
const chart = element('chart');
const context = chart.getContext('2d');
const reaction = element('reaction');
const priceFormat = new Intl.NumberFormat('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const axis = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const date = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'UTC' });
const clock = new Intl.DateTimeFormat('pt-BR', { timeStyle: 'medium', timeZone: 'Asia/Tokyo' });
const palette = { up: '#49e9ad', down: '#ff7189', flat: '#a0afc0' };
const day = 86400000;
const api = 'https://data-api.binance.vision/api/v3';
const feed = 'wss://data-stream.binance.vision/ws/btcusdt@trade';
const staleAfter = 12000;
const percent = new Intl.NumberFormat('pt-BR', {
  style:'percent', signDisplay:'exceptZero', minimumFractionDigits:2, maximumFractionDigits:2
});
const utcDay = time => Math.floor(time / day) * day;
let candles = [];
let trade;
let liveLow = Infinity;
let liveHigh = -Infinity;
let socket;
let lastLiveAt = 0;
let tickerBusy = false;
let quoteFrame = 0;

function updateStatus() {
  const now = Date.now();
  if (candles.at(-1)?.[0] !== utcDay(now) / 1000) {
    element('status').textContent = 'Aguardando a abertura de hoje · 09:00 JST';
    return;
  }
  if (!trade || utcDay(trade.time) !== utcDay(now)) {
    element('status').textContent = 'Candle de referência · aguardando cotação atual';
    return;
  }
  const mode = now - trade.time > staleAfter ? 'Último negócio disponível' :
    now - lastLiveAt <= staleAfter ? 'Ao vivo' : 'Atualização de reserva';
  element('status').textContent = mode + ' · ' + clock.format(trade.time) + ' JST · abertura 09:00 JST';
}

function applyTrade() {
  const row = candles.at(-1);
  if (!row || !trade || row[0] !== utcDay(trade.time) / 1000) return;
  row[1] = Math.min(row[1], liveLow);
  row[2] = Math.max(row[2], liveHigh);
  row[4] = trade.price;
}

function acceptTrade({time, price: rawPrice, id}, fromSocket) {
  const price = Number(rawPrice);
  const now = Date.now();
  if (utcDay(time) !== utcDay(now) || !Number.isFinite(price) || price <= 0 ||
      !Number.isSafeInteger(id) || id <= 0) return;
  if (fromSocket && now - time <= staleAfter) lastLiveAt = now;
  if (trade && id <= trade.id) {
    updateStatus();
    return;
  }
  if (!trade || utcDay(trade.time) !== utcDay(time)) {
    liveLow = Infinity;
    liveHigh = -Infinity;
  }
  trade = {time, price, id};
  liveLow = Math.min(liveLow, price);
  liveHigh = Math.max(liveHigh, price);
  if (candles.at(-1)?.[0] !== utcDay(time) / 1000) return;
  applyTrade();
  if (!quoteFrame) quoteFrame = requestAnimationFrame(() => {
    quoteFrame = 0;
    if (candles.at(-1)?.[0] === utcDay(Date.now()) / 1000) render();
  });
}

async function refreshTicker() {
  if (tickerBusy || Date.now() - lastLiveAt <= staleAfter) return;
  tickerBusy = true;
  try {
    const response = await fetch(api + '/trades?symbol=BTCUSDT&limit=1', {
      cache:'no-store', signal:AbortSignal.timeout(5000)
    });
    if (response.ok) {
      const [latest] = await response.json();
      if (latest) acceptTrade(latest, false);
    }
  } catch {
    // Preserve the last trade while the next request retries.
  } finally {
    tickerBusy = false;
    updateStatus();
  }
}

function connect() {
  const connection = new WebSocket(feed);
  socket = connection;
  connection.addEventListener('message', event => {
    if (socket !== connection) return;
    const message = JSON.parse(event.data);
    if (message.e === 'trade' && message.s === 'BTCUSDT') {
      acceptTrade({time:message.T, price:message.p, id:message.t}, true);
    }
  });
  connection.addEventListener('error', () => connection.close());
  connection.addEventListener('close', () => {
    if (socket !== connection) return;
    lastLiveAt = 0;
    updateStatus();
    refreshTicker();
    setTimeout(connect, 2500);
  });
}

function direction(open, close) {
  return close > open ? 'up' : close < open ? 'down' : 'flat';
}

function draw() {
  const {width, height} = chart.getBoundingClientRect();
  if (!width || !height || !candles.length) return;
  const dpi = window.devicePixelRatio || 1;
  chart.width = Math.round(width * dpi);
  chart.height = Math.round(height * dpi);
  context.scale(dpi, dpi);
  const visible = candles.slice(width < 520 ? -7 : -18);
  const ceiling = Math.max(...visible.map(candle => candle[2]));
  const floor = Math.min(...visible.map(candle => candle[1]));
  const margin = Math.max((ceiling - floor) * .1, 1);
  const top = ceiling + margin, bottom = floor - margin;
  const plotHeight = Math.max(24, height - 34);
  const axisWidth = width < 520 ? 53 : 73;
  const reactionWidth = Math.round(width * (width < 520 ? .46 : .40));
  const plotEnd = width - reactionWidth;
  const plotWidth = plotEnd - axisWidth;
  const speechSpace = 43;
  const fightRatio = 1.2;
  const artSize = Math.max(1, Math.min(reactionWidth / fightRatio, (height - speechSpace - 8) / (1 + fightRatio)));
  const fightSize = artSize * fightRatio;
  reaction.style.setProperty('--fight-size', fightSize + 'px');
  reaction.style.setProperty('--reaction-width', reactionWidth + 'px');
  reaction.style.setProperty('--reaction-size', artSize + 'px');
  const y = price => 10 + (top - price) / (top - bottom) * plotHeight;
  const step = plotWidth / (visible.length + 1);
  context.font = (width < 520 ? '10' : '12') + 'px system-ui';
  for (let i = 0; i <= 5; i++) {
    const level = top - (top - bottom) * i / 5;
    context.fillStyle = '#293442';
    context.fillRect(axisWidth, y(level), plotWidth, 1);
    context.fillStyle = '#a0afc0';
    context.fillText(axis.format(level), 3, y(level) + 4);
  }
  visible.forEach(([time, low, high, open, close], i) => {
    const today = i === visible.length - 1;
    const x = today ? plotEnd - Math.max(10, Math.min(step * .68, 24)) : axisWidth + step * (i + .6);
    const body = today ? Math.min(step * 1.16, 36) : Math.min(step * .46, 13);
    if (today) {
      const center = y((open + close) / 2);
      const artCenter = Math.min(height - artSize / 2, Math.max(fightSize + speechSpace + artSize / 2, center));
      reaction.style.setProperty('--reaction-top', artCenter + 'px');
      reaction.style.setProperty('--fight-top', Math.max(0, artCenter - artSize / 2 - speechSpace - fightSize) + 'px');
      context.fillStyle = '#ffffff0e';
      const band = Math.max(9, body / 2 + 5);
      context.fillRect(x - band, 0, Math.min(band * 2, plotEnd - x + band), height - 19);
    }
    context.fillStyle = palette[direction(open, close)];
    context.fillRect(x - 1, y(high), 2, Math.max(1, y(low) - y(high)));
    context.fillRect(x - body / 2, Math.min(y(open), y(close)), body, Math.max(2, Math.abs(y(open) - y(close))));
    if (today || (i % 4 === 0 && i < visible.length - 2)) {
      context.textAlign = 'center';
      context.fillStyle = today ? '#f4b95f' : '#a0afc0';
      context.fillText(today ? 'HOJE' : date.format(time * 1000), Math.max(19, x), height - 5);
      context.textAlign = 'start';
    }
  });
}

function render() {
  const [time, low, high, open, close] = candles.at(-1);
  const mood = direction(open, close);
  element('dashboard').dataset.direction = mood;
  const verdict = element('verdict');
  const label = {up:'Walter tem razão', down:'Dr. tem razão', flat:'Na abertura do dia'}[mood];
  if (verdict.textContent !== label) verdict.textContent = label;
  element('price').textContent = priceFormat.format(close);
  element('change').textContent = percent.format((close - open) / open);
  for (const [id, value] of Object.entries({open, high, low})) element(id).textContent = priceFormat.format(value);
  element('up').hidden = mood !== 'up';
  element('down').hidden = mood !== 'down';
  chart.setAttribute('aria-label', 'BTC/USDT diário em ' + date.format(time * 1000) +
    '. Abertura ' + priceFormat.format(open) + '. Último preço ' + priceFormat.format(close));
  updateStatus();
  draw();
}

async function refresh() {
  try {
    const start = new Date(Math.floor(Date.now() / day) * day);
    const parameters = new URLSearchParams({symbol:'BTCUSDT', interval:'1d', limit:24});
    const response = await fetch(api + '/klines?' + parameters, {
      cache:'no-store', signal:AbortSignal.timeout(10000)
    });
    if (!response.ok) throw new Error('Binance indisponível');
    const rows = await response.json();
    const next = rows.filter(row => Array.isArray(row) && row.length >= 5)
      .map(([time, open, high, low, close]) => [time / 1000, Number(low), Number(high), Number(open), Number(close)])
      .filter(row => row.every(Number.isFinite) && row[0] <= +start / 1000 &&
      row[1] > 0 && row[1] <= Math.min(row[3], row[4]) && row[2] >= Math.max(row[3], row[4]))
      .sort((a,b) => a[0]-b[0]);
    if (next.at(-1)?.[0] !== +start / 1000 || Math.floor(Date.now() / day) * day !== +start) {
      throw new Error('Candle diário indisponível');
    }
    const previous = candles.at(-1);
    const current = next.at(-1);
    if (previous?.[0] === current[0]) {
      current[1] = Math.min(current[1], previous[1]);
      current[2] = Math.max(current[2], previous[2]);
    }
    candles = next;
    applyTrade();
    render();
  } catch {
    const sameDay = candles.at(-1)?.[0] === Math.floor(Date.now() / day) * day / 1000;
    updateStatus();
    if (!sameDay) {
      element('dashboard').dataset.direction = 'flat';
      element('verdict').textContent = 'Aguardando candle…';
      element('up').hidden = element('down').hidden = true;
      for (const id of ['price','change','open','high','low']) element(id).textContent = '—';
      if (candles.length) {
        candles = [];
        context.clearRect(0,0,chart.width,chart.height);
      }
    }
  } finally {
    setTimeout(refresh, Math.max(500, Math.min(15000, utcDay(Date.now()) + day - Date.now())));
  }
}

new ResizeObserver(draw).observe(chart);
refresh();
refreshTicker();
setInterval(() => {
  updateStatus();
  refreshTicker();
}, 4000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshTicker();
});
connect();
</script>
</html>
