<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pool WBTC/SOL</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0e;
      --panel: #0f141b;
      --line: #232b37;
      --text: #e8edf4;
      --muted: #7e8794;
      --green: #27b38d;
      --red: #e15561;
      --amber: #f0a13a;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #101720, #0b1017);
      flex: 0 0 auto;
    }

    .pair {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      letter-spacing: .3px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--amber);
      box-shadow: 0 0 10px rgba(240, 161, 58, .75);
    }

    .price {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: clamp(1rem, 4vw, 1.65rem);
      min-width: 6.2ch;
    }

    .badge {
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 7px;
      padding: 3px 8px;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .badge.ok {
      color: var(--green);
      border-color: rgba(39, 179, 141, .42);
      background: rgba(39, 179, 141, .08);
    }

    .badge.out {
      color: var(--amber);
      border-color: rgba(240, 161, 58, .42);
      background: rgba(240, 161, 58, .08);
    }

    .spacer { flex: 1; }

    .tf {
      display: inline-flex;
      gap: 4px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1017;
    }

    .tf button {
      border: 0;
      border-radius: 6px;
      padding: 5px 8px;
      background: transparent;
      color: var(--muted);
      font: 700 .75rem "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }

    .tf button.active {
      background: rgba(240, 161, 58, .18);
      color: var(--amber);
    }

    .fee-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border: 1px solid rgba(39, 179, 141, .35);
      border-radius: 8px;
      padding: 6px 8px;
      background: rgba(39, 179, 141, .08);
      color: var(--green);
      font: 700 .78rem Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    .fee-btn:hover {
      border-color: rgba(39, 179, 141, .65);
    }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: .82rem;
      white-space: nowrap;
    }

    .action-btn {
      background: #0b1017;
      cursor: pointer;
      font: 700 .78rem Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .action-btn:hover,
    .back:hover {
      border-color: rgba(240, 161, 58, .45);
      color: var(--amber);
    }

    main {
      position: relative;
      min-height: 0;
      flex: 1;
      padding: 8px;
    }

    .stage {
      position: relative;
      height: 100%;
      min-height: 360px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #080c12;
    }

    #chart,
    #overlay {
      position: absolute;
      inset: 0;
    }

    #overlay {
      pointer-events: none;
      z-index: 4;
    }

    .pool-card,
    .history-card,
    .allocation-card {
      position: absolute;
      z-index: 7;
      border: 1px solid rgba(240, 161, 58, .72);
      border-radius: 8px;
      background: rgba(8, 10, 14, .9);
      box-shadow: 0 14px 28px rgba(0, 0, 0, .35);
      backdrop-filter: blur(8px);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .pool-card {
      width: 292px;
      padding: 10px;
      pointer-events: auto;
    }

    .card-title {
      color: var(--amber);
      font-size: .72rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .metric-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      min-height: 21px;
      font-size: .72rem;
    }

    .metric-row .label {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric-row .value {
      color: var(--text);
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    .metric-row.positive .value { color: var(--green); }
    .metric-row.negative .value { color: var(--red); }

    .fee-add {
      width: 24px;
      height: 24px;
      border: 1px solid rgba(39, 179, 141, .5);
      border-radius: 6px;
      background: rgba(39, 179, 141, .1);
      color: var(--green);
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }

    .fee-add:hover { border-color: rgba(39, 179, 141, .8); }
    .metric-row.no-btn .fee-add { visibility: hidden; pointer-events: none; }

    .fee-actions {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fee-withdraw {
      min-width: 46px;
      height: 24px;
      border: 1px solid rgba(255, 255, 255, .32);
      border-radius: 6px;
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      font-size: .62rem;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }

    .fee-withdraw:hover { border-color: rgba(255, 255, 255, .65); }

    .allocation-card {
      width: 292px;
      padding: 10px;
      pointer-events: none;
      border-color: rgba(255, 255, 255, .86);
    }

    .allocation-card .card-title { color: #e8edf4; }

    .alloc-bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: rgba(255, 255, 255, .06);
      display: flex;
      margin-bottom: 8px;
    }

    .alloc-fill.sol {
      width: 50%;
      background: linear-gradient(90deg, #27b38d, #58d8b5);
    }

    .alloc-fill.btc {
      flex: 1;
      background: linear-gradient(90deg, #f0a13a, #ffd166);
    }

    .alloc-line {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 20px;
      font-size: .7rem;
    }

    .alloc-line span {
      color: var(--muted);
      font-weight: 800;
    }

    .alloc-line b {
      color: var(--text);
      font-weight: 900;
      text-align: right;
    }

    .alloc-line em {
      color: var(--muted);
      font-style: normal;
      text-align: right;
    }

    .history-card {
      left: 12px;
      bottom: 12px;
      width: min(360px, calc(100% - 24px));
      max-height: 190px;
      padding: 10px;
      pointer-events: auto;
      border-color: rgba(255, 255, 255, .18);
    }

    .history-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .history-head .card-title {
      margin: 0;
      flex: 1;
      color: #e8edf4;
    }

    .history-action {
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 6px;
      background: rgba(255, 255, 255, .06);
      color: var(--muted);
      padding: 4px 7px;
      font-size: .68rem;
      font-weight: 800;
      cursor: pointer;
    }

    .history-list {
      display: grid;
      gap: 5px;
      max-height: 138px;
      overflow: auto;
      color: var(--muted);
      font-size: .68rem;
      line-height: 1.3;
    }

    .history-item strong { color: var(--text); font-weight: 800; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, .62);
      backdrop-filter: blur(7px);
    }

    .modal-backdrop[hidden] { display: none; }

    .fee-modal {
      width: min(340px, 100%);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 10px;
      background: #0d1118;
      box-shadow: 0 22px 50px rgba(0, 0, 0, .48);
      padding: 14px;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .fee-modal h2 {
      margin: 0 0 6px;
      color: var(--text);
      font-size: .95rem;
    }

    .fee-modal p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .75rem;
      line-height: 1.35;
    }

    .fee-modal input {
      width: 100%;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 8px;
      background: rgba(255, 255, 255, .06);
      color: var(--text);
      padding: 0 12px;
      font: 800 1rem "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
    }

    .fee-modal input:focus { border-color: rgba(39, 179, 141, .75); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-actions button {
      min-height: 36px;
      border-radius: 8px;
      padding: 0 12px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .modal-actions .cancel {
      border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .06);
      color: var(--muted);
    }

    .modal-actions .save {
      border: 1px solid rgba(39, 179, 141, .7);
      background: rgba(39, 179, 141, .18);
      color: var(--green);
    }

    .loading {
      position: absolute;
      left: 12px;
      bottom: 10px;
      z-index: 5;
      color: var(--muted);
      font: 600 .78rem "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(8, 10, 14, .78);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 7px;
      padding: 7px 9px;
    }

    .loading[hidden] { display: none; }

    @media (max-width: 680px) {
      header { gap: 7px; padding: 6px 8px; }
      .badge { display: none; }
      .tf button { padding: 5px 7px; }
      .price { font-size: .9rem; }
      .back { padding: 5px 7px; font-size: .75rem; }
      .fee-btn { padding: 5px 7px; font-size: .75rem; }
      .pool-card { width: 268px; }
      .allocation-card { width: 268px; }
      .history-card { max-height: 140px; }
      main { padding: 6px; }
      .stage { border-radius: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="pair"><span class="dot"></span><span>WBTC/SOL</span></div>
    <div class="price" id="ratio">--</div>
    <div class="badge ok" id="rangeStatus">In Range</div>
    <div class="badge" id="rangeText">721.82 - 797.73</div>
    <div class="badge" id="liveText">tick 1s</div>
    <div class="spacer"></div>
    <div class="tf" aria-label="Timeframe">
      <button data-tf="1h" class="active">1H</button>
      <button data-tf="4h">4H</button>
      <button data-tf="1d">1D</button>
    </div>
    <button class="back action-btn" id="fullscreenBtn" type="button">Tela cheia</button>
    <a class="back" href="index.html">Terminal</a>
  </header>

  <main>
    <section class="stage" id="stage" aria-label="Grafico limpo da pool WBTC/SOL">
      <div id="chart"></div>
      <canvas id="overlay"></canvas>
      <div class="pool-card" id="poolCard" aria-label="Dados da pool">
        <div class="card-title">Pool WBTC/SOL</div>
        <div class="metric-row no-btn" id="rowLiquidity"><span class="label">Liquidez</span><span class="value" id="metricLiquidity">--</span><button class="fee-add" type="button">+</button></div>
        <div class="metric-row no-btn" id="rowPnl"><span class="label">PnL</span><span class="value" id="metricPnl">--</span><button class="fee-add" type="button">+</button></div>
        <div class="metric-row no-btn" id="rowCapital"><span class="label">Capital</span><span class="value" id="metricCapital">--</span><button class="fee-add" type="button">+</button></div>
        <div class="metric-row" id="rowUncollected"><span class="label">Taxas Não Coletadas</span><span class="value" id="metricUncollected">--</span><span class="fee-actions"><button class="fee-add" type="button" data-fee="uncollectedFees">+</button><button class="fee-withdraw" id="collectFeesBtn" type="button">Sacar</button></span></div>
        <div class="metric-row no-btn" id="rowCollected"><span class="label">Taxas Coletadas</span><span class="value" id="metricCollected">--</span><button class="fee-add" type="button">+</button></div>
        <div class="metric-row no-btn" id="rowAge"><span class="label">Vida da Pool</span><span class="value" id="metricAge">--</span><button class="fee-add" type="button">+</button></div>
      </div>
      <div class="allocation-card" id="allocationCard" aria-label="Composição da pool">
        <div class="card-title">Composição</div>
        <div class="alloc-bar" aria-hidden="true">
          <div class="alloc-fill sol" id="solFill"></div>
          <div class="alloc-fill btc" id="btcFill"></div>
        </div>
        <div class="alloc-line"><span>SOL</span><b id="solShare">--</b><em id="solValue">--</em></div>
        <div class="alloc-line"><span>WBTC</span><b id="btcShare">--</b><em id="btcValue">--</em></div>
      </div>
      <div class="history-card" id="historyCard" aria-label="Histórico da pool">
        <div class="history-head">
          <div class="card-title">Histórico da Pool</div>
          <button class="history-action" id="snapshotBtn" type="button">Snapshot</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
      <div class="loading" id="loading">carregando BTC/SOL...</div>
    </section>
  </main>

  <div class="modal-backdrop" id="feeModal" hidden>
    <form class="fee-modal" id="feeForm">
      <h2 id="feeModalTitle">Adicionar taxa</h2>
      <p>Digite o valor em dólar que ainda está pendente para coletar.</p>
      <input id="feeInput" inputmode="decimal" autocomplete="off" placeholder="Ex: 1.25">
      <div class="modal-actions">
        <button class="cancel" id="feeCancel" type="button">Cancelar</button>
        <button class="save" type="submit">Salvar</button>
      </div>
    </form>
  </div>

  <script>
    const POOL = {
      capital: 3669.971423,
      lower: 721.816316,
      upper: 797.726412,
      solAmount: 18.6127605,
      btcAmount: 0.01735508,
      uncollectedFees: 0.44,
      collectedFees: 12.70
    };

    const STORAGE_KEY = "wbtc_sol_pool_live_v3";
    const OLD_STORAGE_KEY = "wbtc_sol_pool_live_v2";
    const ACCIDENTAL_WITHDRAW_KEY = "wbtc_sol_pool_accidental_withdraw_fix";
    const POOL_STARTED_AT = new Date("2026-10-13T01:45:00+09:00").getTime();
    const perMs = { "1h": 3600000, "4h": 14400000, "1d": 86400000 };
    const state = {
      tf: "1h",
      candles: [],
      btcUsd: 0,
      solUsd: 0,
      lastUpdate: null,
      firstLoad: true,
      loading: false,
      ticking: false,
      uncollectedFees: POOL.uncollectedFees,
      collectedFees: POOL.collectedFees,
      history: []
    };

    const $ = id => document.getElementById(id);
    const chartEl = $("chart");
    const overlay = $("overlay");
    const ctx = overlay.getContext("2d");

    let migratedState = false;
    try {
      const rawState = localStorage.getItem(STORAGE_KEY);
      const rawOldState = localStorage.getItem(OLD_STORAGE_KEY);
      const saved = JSON.parse(rawState || rawOldState || "{}");
      migratedState = !rawState && !!rawOldState;
      if (Number.isFinite(Number(saved.uncollectedFees))) state.uncollectedFees = Number(saved.uncollectedFees);
      if (Number.isFinite(Number(saved.collectedFees))) state.collectedFees = Number(saved.collectedFees);
      if (Number.isFinite(Number(saved.reinsertedFees))) state.collectedFees += Number(saved.reinsertedFees);
      if (Array.isArray(saved.history)) state.history = saved.history.slice(0, 80);
    } catch (err) {}

    try {
      const alreadyFixed = localStorage.getItem(ACCIDENTAL_WITHDRAW_KEY) === "1";
      const hasAccidentalLog = state.history.some(item => String(item.text || "").includes("Taxas sacadas $0.44"));
      const looksAccidental = Math.abs(state.uncollectedFees) < 0.0001 && Math.abs(state.collectedFees - 13.14) < 0.01;
      if (!alreadyFixed && hasAccidentalLog && looksAccidental) {
        state.uncollectedFees = 0.44;
        state.collectedFees = 12.70;
        state.history.unshift({
          kind: "fix",
          text: "Correção automática · saque de $0.44 desfeito",
          ts: new Date().toISOString()
        });
        localStorage.setItem(ACCIDENTAL_WITHDRAW_KEY, "1");
        migratedState = true;
      }
    } catch (err) {}

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          uncollectedFees: state.uncollectedFees,
          collectedFees: state.collectedFees,
          history: state.history.slice(0, 80)
        }));
      } catch (err) {}
    }

    if (migratedState) saveState();

    const chart = LightweightCharts.createChart(chartEl, {
      layout: {
        background: { type: "solid", color: "#080c12" },
        textColor: "#8e98a8",
        fontFamily: "IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
      },
      grid: {
        vertLines: { color: "rgba(255,255,255,.045)" },
        horzLines: { color: "rgba(255,255,255,.055)" }
      },
      rightPriceScale: {
        borderColor: "rgba(255,255,255,.12)",
        scaleMargins: { top: .08, bottom: .12 }
      },
      timeScale: {
        borderColor: "rgba(255,255,255,.12)",
        rightOffset: 14,
        barSpacing: 9,
        timeVisible: true,
        secondsVisible: false
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
        vertLine: { color: "rgba(255,255,255,.24)", style: 3 },
        horzLine: { color: "rgba(255,255,255,.24)", style: 3 }
      },
      handleScroll: true,
      handleScale: true
    });

    const series = chart.addCandlestickSeries({
      upColor: "#26a69a",
      downColor: "#ef5350",
      borderUpColor: "#26a69a",
      borderDownColor: "#ef5350",
      wickUpColor: "#26a69a",
      wickDownColor: "#ef5350",
      priceFormat: { type: "price", precision: 2, minMove: .01 }
    });

    const rangeTop = series.createPriceLine({
      price: POOL.upper,
      color: "rgba(255,255,255,.92)",
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true,
      title: "Range alto"
    });

    const rangeBottom = series.createPriceLine({
      price: POOL.lower,
      color: "rgba(255,255,255,.92)",
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true,
      title: "Range baixo"
    });

    function usd(n) {
      return "$" + (Number(n) || 0).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function pct(n) {
      const v = (Number(n) || 0) * 100;
      return (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
    }

    function poolAge() {
      const diff = Math.max(0, Date.now() - POOL_STARTED_AT);
      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor(totalSeconds % 86400 / 3600);
      const minutes = Math.floor(totalSeconds % 3600 / 60);
      const seconds = totalSeconds % 60;
      return days + "d " + String(hours).padStart(2, "0") + "h " + String(minutes).padStart(2, "0") + "m " + String(seconds).padStart(2, "0") + "s";
    }

    function feeLabel(key) {
      return ({
        uncollectedFees: "Taxas Não Coletadas",
        collectedFees: "Taxas Coletadas"
      })[key] || "Taxas";
    }

    function addHistory(kind, text) {
      state.history.unshift({
        kind,
        text,
        ts: new Date().toISOString()
      });
      state.history = state.history.slice(0, 80);
      saveState();
      renderHistory();
    }

    function renderHistory() {
      const list = $("historyList");
      if (!state.history.length) {
        list.innerHTML = '<div class="history-item">Sem registros ainda.</div>';
        return;
      }
      list.innerHTML = state.history.slice(0, 10).map(item => {
        const date = new Date(item.ts).toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
        return '<div class="history-item"><strong>' + date + '</strong> · ' + item.text + '</div>';
      }).join("");
    }

    function resize() {
      const r = $("stage").getBoundingClientRect();
      chart.applyOptions({ width: Math.max(1, r.width), height: Math.max(1, r.height) });
      const dpr = window.devicePixelRatio || 1;
      overlay.width = Math.max(1, Math.floor(r.width * dpr));
      overlay.height = Math.max(1, Math.floor(r.height * dpr));
      overlay.style.width = r.width + "px";
      overlay.style.height = r.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawOverlay();
    }

    function normalizeTf(tf) {
      return tf === "1d" ? "1d" : tf;
    }

    async function hyperCandles(symbol, tf) {
      const now = Date.now();
      const interval = normalizeTf(tf);
      const start = now - (perMs[tf] || perMs["1h"]) * 520;
      const res = await fetch("https://api.hyperliquid.xyz/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type: "candleSnapshot",
          req: {
            coin: symbol,
            interval,
            startTime: start,
            endTime: now
          }
        })
      });
      if (!res.ok) throw new Error("hyperliquid " + res.status);
      const data = await res.json();
      if (!Array.isArray(data) || !data.length) throw new Error("sem candles");
      return data.map(k => ({
        time: Math.floor(k.t / 1000),
        open: Number(k.o),
        high: Number(k.h),
        low: Number(k.l),
        close: Number(k.c),
        volume: Number(k.v) || 0
      }));
    }

    async function binanceCandles(symbol, tf) {
      const map = { "1h": "1h", "4h": "4h", "1d": "1d" };
      const url = "https://api.binance.com/api/v3/klines?symbol=" + symbol + "&interval=" + map[tf] + "&limit=520";
      const res = await fetch(url);
      if (!res.ok) throw new Error("binance " + res.status);
      const data = await res.json();
      return data.map(k => ({
        time: Math.floor(k[0] / 1000),
        open: Number(k[1]),
        high: Number(k[2]),
        low: Number(k[3]),
        close: Number(k[4]),
        volume: Number(k[5]) || 0
      }));
    }

    async function loadUsdCandles(tf) {
      try {
        return await Promise.all([hyperCandles("BTC", tf), hyperCandles("SOL", tf)]);
      } catch (err) {
        return Promise.all([binanceCandles("BTCUSDT", tf), binanceCandles("SOLUSDT", tf)]);
      }
    }

    function buildRatioCandles(btc, sol) {
      const solMap = new Map(sol.map(c => [c.time, c]));
      const out = [];
      for (const b of btc) {
        const s = solMap.get(b.time);
        if (!s || !s.open || !s.high || !s.low || !s.close) continue;
        out.push({
          time: b.time,
          open: b.open / s.open,
          high: b.high / s.low,
          low: b.low / s.high,
          close: b.close / s.close
        });
      }
      const lastBtc = btc[btc.length - 1];
      const lastSol = sol[sol.length - 1];
      if (lastBtc && lastSol) {
        state.btcUsd = lastBtc.close;
        state.solUsd = lastSol.close;
      }
      return out;
    }

    async function load() {
      if (state.loading) return;
      state.loading = true;
      $("loading").hidden = false;
      try {
        const [btc, sol] = await loadUsdCandles(state.tf);
        state.candles = buildRatioCandles(btc, sol);
        state.lastUpdate = new Date();
        series.setData(state.candles);
        if (state.firstLoad) {
          chart.timeScale().fitContent();
          state.firstLoad = false;
        }
        chart.timeScale().applyOptions({ rightOffset: 24 });
        renderHeader();
        drawOverlay();
        $("loading").hidden = true;
        tick();
      } catch (err) {
        $("loading").textContent = "falha ao carregar precos: " + err.message;
      } finally {
        state.loading = false;
      }
    }

    async function hyperSpotPrices() {
      const res = await fetch("https://api.hyperliquid.xyz/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "allMids" })
      });
      if (!res.ok) throw new Error("hyperliquid ticker " + res.status);
      const data = await res.json();
      return {
        btc: Number(data.BTC),
        sol: Number(data.SOL)
      };
    }

    async function binanceSpotPrices() {
      const symbols = encodeURIComponent(JSON.stringify(["BTCUSDT", "SOLUSDT"]));
      const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbols=" + symbols);
      if (!res.ok) throw new Error("binance ticker " + res.status);
      const data = await res.json();
      const map = Object.fromEntries(data.map(item => [item.symbol, Number(item.price)]));
      return { btc: map.BTCUSDT, sol: map.SOLUSDT };
    }

    async function fetchSpotPrices() {
      try {
        return await hyperSpotPrices();
      } catch (err) {
        return binanceSpotPrices();
      }
    }

    function bucketTime(nowMs) {
      const step = perMs[state.tf] || perMs["1h"];
      return Math.floor(nowMs / step) * step / 1000;
    }

    function applySpotPrices(btcUsd, solUsd) {
      if (!btcUsd || !solUsd || !state.candles.length) return;
      state.btcUsd = btcUsd;
      state.solUsd = solUsd;
      state.lastUpdate = new Date();

      const ratio = btcUsd / solUsd;
      const time = bucketTime(Date.now());
      const last = state.candles[state.candles.length - 1];
      let candle;
      if (time > last.time) {
        candle = {
          time,
          open: last.close,
          high: Math.max(last.close, ratio),
          low: Math.min(last.close, ratio),
          close: ratio
        };
        state.candles.push(candle);
        if (state.candles.length > 540) state.candles.shift();
      } else {
        candle = {
          ...last,
          high: Math.max(last.high, ratio),
          low: Math.min(last.low, ratio),
          close: ratio
        };
        state.candles[state.candles.length - 1] = candle;
      }
      series.update(candle);
      renderHeader();
      drawOverlay();
    }

    async function tick() {
      if (state.ticking || !state.candles.length) return;
      state.ticking = true;
      try {
        const prices = await fetchSpotPrices();
        applySpotPrices(prices.btc, prices.sol);
      } catch (err) {
        $("liveText").textContent = "tick falhou";
      } finally {
        state.ticking = false;
      }
    }

    function currentRatio() {
      const last = state.candles[state.candles.length - 1];
      return last ? last.close : 0;
    }

    function liquidity() {
      return POOL.solAmount * state.solUsd + POOL.btcAmount * state.btcUsd;
    }

    function totalPositionValue() {
      return liquidity() + state.uncollectedFees + state.collectedFees;
    }

    function composition() {
      const solValue = POOL.solAmount * state.solUsd;
      const btcValue = POOL.btcAmount * state.btcUsd;
      const total = solValue + btcValue;
      return {
        solValue,
        btcValue,
        solPct: total ? solValue / total : 0,
        btcPct: total ? btcValue / total : 0
      };
    }

    function renderHeader() {
      const ratio = currentRatio();
      const inside = ratio >= POOL.lower && ratio <= POOL.upper;
      $("ratio").textContent = ratio ? ratio.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "--";
      $("rangeStatus").textContent = inside ? "In Range" : (ratio < POOL.lower ? "Abaixo" : "Acima");
      $("rangeStatus").className = "badge " + (inside ? "ok" : "out");
      $("rangeText").textContent = POOL.lower.toFixed(2) + " - " + POOL.upper.toFixed(2);
      $("liveText").textContent = state.lastUpdate
        ? "tick 1s · " + state.lastUpdate.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" })
        : "tick 1s";
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawOverlay() {
      const w = overlay.clientWidth || 0;
      const h = overlay.clientHeight || 0;
      ctx.clearRect(0, 0, w, h);
      if (!state.candles.length) return;

      const yHigh = series.priceToCoordinate(POOL.upper);
      const yLow = series.priceToCoordinate(POOL.lower);
      const ratio = currentRatio();
      const yNow = series.priceToCoordinate(ratio);
      const last = state.candles[state.candles.length - 1];
      const xLast = chart.timeScale().timeToCoordinate(last.time);
      const spacing = chart.timeScale().options().barSpacing || 9;
      const anchorX = (xLast == null ? w - 190 : xLast + spacing * 3);
      const anchorY = yNow == null ? h * .36 : yNow;

      if (yHigh != null && yLow != null) {
        const top = Math.min(yHigh, yLow);
        const bottom = Math.max(yHigh, yLow);
        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,.035)";
        ctx.fillRect(0, top, w, Math.max(1, bottom - top));
        ctx.strokeStyle = "rgba(255,255,255,.95)";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(0, yHigh);
        ctx.lineTo(w, yHigh);
        ctx.moveTo(0, yLow);
        ctx.lineTo(w, yLow);
        ctx.stroke();
        ctx.restore();
      }

      if (yNow != null) {
        ctx.save();
        ctx.setLineDash([4, 5]);
        ctx.strokeStyle = "rgba(240,161,58,.85)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, yNow);
        ctx.lineTo(w, yNow);
        ctx.stroke();
        ctx.restore();
      }

      updatePoolCard(anchorX, anchorY, w, h);
    }

    function setMetric(rowId, valueId, value, tone) {
      const row = $(rowId);
      const el = $(valueId);
      row.classList.remove("positive", "negative");
      if (tone) row.classList.add(tone);
      el.textContent = value;
    }

    function updatePoolCard(anchorX, anchorY, w, h) {
      const card = $("poolCard");
      const allocation = $("allocationCard");
      const liq = liquidity();
      const pnl = totalPositionValue() - POOL.capital;
      const pnlPct = POOL.capital ? pnl / POOL.capital : 0;
      const pnlTone = pnl >= 0 ? "positive" : "negative";
      const comp = composition();

      setMetric("rowLiquidity", "metricLiquidity", usd(liq));
      setMetric("rowPnl", "metricPnl", usd(pnl) + " (" + pct(pnlPct) + ")", pnlTone);
      setMetric("rowCapital", "metricCapital", usd(POOL.capital));
      setMetric("rowUncollected", "metricUncollected", usd(state.uncollectedFees), "positive");
      setMetric("rowCollected", "metricCollected", usd(state.collectedFees), "positive");
      setMetric("rowAge", "metricAge", poolAge());
      $("solFill").style.width = (comp.solPct * 100).toFixed(2) + "%";
      $("solShare").textContent = (comp.solPct * 100).toFixed(1) + "%";
      $("btcShare").textContent = (comp.btcPct * 100).toFixed(1) + "%";
      $("solValue").textContent = usd(comp.solValue);
      $("btcValue").textContent = usd(comp.btcValue);

      const bw = card.offsetWidth || 292;
      const bh = card.offsetHeight || 182;
      const ah = allocation.offsetHeight || 88;
      let bx = anchorX;
      let by = anchorY - bh / 2;
      if (bx + bw > w - 8) bx = w - bw - 8;
      if (bx < 8) bx = 8;
      if (by < 10) by = 10;
      if (by + bh + ah + 8 > h - 10) by = Math.max(10, h - bh - ah - 18);
      card.style.transform = "translate(" + Math.round(bx) + "px, " + Math.round(by) + "px)";
      allocation.style.transform = "translate(" + Math.round(bx) + "px, " + Math.round(by + bh + 8) + "px)";
    }

    new ResizeObserver(resize).observe($("stage"));
    chart.timeScale().subscribeVisibleTimeRangeChange(drawOverlay);
    chart.timeScale().subscribeVisibleLogicalRangeChange(drawOverlay);
    chart.subscribeCrosshairMove(drawOverlay);

    document.querySelectorAll(".tf button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tf button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.tf = btn.dataset.tf;
        state.firstLoad = true;
        load();
      });
    });

    let activeFeeKey = null;

    function openFeeModal(key) {
      activeFeeKey = key;
      $("feeModalTitle").textContent = "Adicionar em " + feeLabel(key);
      $("feeInput").value = "";
      $("feeModal").hidden = false;
      setTimeout(() => $("feeInput").focus(), 80);
    }

    function closeFeeModal() {
      $("feeModal").hidden = true;
      activeFeeKey = null;
    }

    function addFeeValue(key, value) {
      const amount = Number(String(value).replace(",", "."));
      if (!Number.isFinite(amount) || amount <= 0) return false;
      state[key] += amount;
      saveState();
      addHistory("fee", feeLabel(key) + " +" + usd(amount) + " · total " + usd(state[key]));
      renderHeader();
      drawOverlay();
      return true;
    }

    document.querySelectorAll(".fee-add[data-fee]").forEach(btn => {
      btn.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        openFeeModal(btn.dataset.fee);
      });
    });

    $("feeForm").addEventListener("submit", event => {
      event.preventDefault();
      if (!activeFeeKey) return;
      if (addFeeValue(activeFeeKey, $("feeInput").value)) closeFeeModal();
    });

    $("feeCancel").addEventListener("click", closeFeeModal);
    $("feeModal").addEventListener("click", event => {
      if (event.target === $("feeModal")) closeFeeModal();
    });

    $("collectFeesBtn").addEventListener("click", () => {
      const amount = state.uncollectedFees;
      if (!amount || amount <= 0) {
        addHistory("fee", "Saque ignorado · sem taxas pendentes");
        return;
      }
      state.uncollectedFees = 0;
      state.collectedFees += amount;
      saveState();
      addHistory("fee", "Taxas sacadas " + usd(amount) + " · coletadas " + usd(state.collectedFees));
      renderHeader();
      drawOverlay();
    });

    $("snapshotBtn").addEventListener("click", () => {
      const liq = liquidity();
      const pnl = totalPositionValue() - POOL.capital;
      const comp = composition();
      addHistory("snapshot", "Snapshot · Liquidez " + usd(liq) + " · PnL " + usd(pnl) + " · SOL " + (comp.solPct * 100).toFixed(1) + "% · WBTC " + (comp.btcPct * 100).toFixed(1) + "%");
    });

    $("fullscreenBtn").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (err) {
        $("loading").hidden = false;
        $("loading").textContent = "nao consegui abrir tela cheia neste navegador";
      }
      setTimeout(resize, 120);
    });

    document.addEventListener("fullscreenchange", () => {
      $("fullscreenBtn").textContent = document.fullscreenElement ? "Sair" : "Tela cheia";
      setTimeout(resize, 120);
    });

    window.addEventListener("resize", resize);
    if (!state.history.length) {
      state.history.push({
        kind: "start",
        text: "Pool criada em 13/10/2026 01:45 JST",
        ts: new Date(POOL_STARTED_AT).toISOString()
      });
      saveState();
    }
    renderHistory();
    resize();
    load();
    setInterval(tick, 1000);
    setInterval(load, 30000);
    requestAnimationFrame(function loop() {
      drawOverlay();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
