<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>IB · HOODX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{
      --bg:#0a0d13;--panel:#111621;--panel2:#0d121b;--line:#1d2534;--line2:#283245;
      --text:#e7ebf2;--muted:#7f8a9e;--green:#26a69a;--red:#ef5350;--accent:#f7931a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
    body{padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}
    button,select,input{font:inherit}
    .topbar{height:34px;display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:0 5px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:9px}
    .back{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:600 9px "IBM Plex Mono",monospace}
    .brand{font-size:13px;font-weight:700;letter-spacing:.3px}.brand span{color:var(--accent)}
    .live{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font:500 10px "IBM Plex Mono",monospace}
    .led{width:7px;height:7px;border-radius:50%;background:var(--muted)}
    .led.on{background:var(--green);box-shadow:0 0 9px var(--green)}
    .screen-btn{height:27px;display:flex;align-items:center;gap:5px;color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:0 8px;cursor:pointer;font:600 9px "IBM Plex Mono",monospace}
    .screen-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
    .screen-btn:hover{border-color:var(--accent);color:var(--accent)}
    .board{height:calc(100dvh - 55px);display:grid;grid-template-rows:minmax(0,1fr) auto;gap:7px;overflow:hidden}
    .charts-row{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:7px;overflow:hidden}
    .summary-row{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(126px,170px);gap:7px;align-items:stretch}
    .asset{min-width:0;min-height:0;overflow:hidden}
    .chart-card,.data-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .chart-card{height:100%;min-height:0}
    .chart-head{height:38px;display:flex;align-items:center;padding:0 9px;border-bottom:1px solid var(--line);gap:6px}
    .symbol{font-size:13px;font-weight:700;letter-spacing:.4px}
    .price-wrap{display:flex;align-items:baseline;gap:5px;min-width:0}
    .price{font:600 11px "IBM Plex Mono",monospace;margin-left:2px;white-space:nowrap}
    .price-jpy{color:var(--muted);font:500 8px "IBM Plex Mono",monospace;white-space:nowrap}
    .change{font:600 10px "IBM Plex Mono",monospace;border-radius:5px;padding:3px 6px}
    .change.up{color:var(--green);background:rgba(33,199,154,.1)}
    .change.down{color:var(--red);background:rgba(239,93,103,.1)}
    .tf{margin-left:auto;color:var(--muted);background:#0b1018;border:1px solid var(--line);border-radius:6px;padding:4px 5px;font:600 9px "IBM Plex Mono",monospace}
    .chart{height:calc(100% - 38px);min-height:0;position:relative}
    .trade-key{position:absolute;z-index:3;top:6px;left:7px;display:flex;gap:5px;pointer-events:none;font:600 7px "IBM Plex Mono",monospace}
    .trade-key span{padding:2px 5px;border-radius:4px;background:rgba(10,13,19,.84);white-space:nowrap}
    .trade-key .buy-key{color:#fff;border:1px solid rgba(255,255,255,.42)}
    .trade-key .sell-key{color:#ef5d67;border:1px dashed #ef5d67}
    .error{display:none;position:absolute;inset:0;place-items:center;text-align:center;color:var(--muted);font:500 11px/1.5 "IBM Plex Mono",monospace;padding:20px;background:rgba(8,11,16,.85);z-index:4}
    .error.show{display:grid}
    .data-card{padding:6px 8px 7px}
    .data-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
    .data-title{color:var(--muted);font:500 9px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.8px}
    .edit{border:1px solid var(--line2);color:var(--text);background:#0b1018;border-radius:6px;padding:3px 6px;cursor:pointer;font:600 8px "IBM Plex Mono",monospace}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
    .metric{min-width:0;padding:5px 0;border-top:1px solid rgba(127,138,157,.12)}
    .metric:nth-child(-n+3){border-top:0}
    .label{display:block;color:var(--muted);font:500 8px "IBM Plex Mono",monospace;margin-bottom:2px}
    .value{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 10px "IBM Plex Mono",monospace}
    .sub{display:block;color:var(--muted);font:500 8px "IBM Plex Mono",monospace;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pnl.up{color:var(--green)}.pnl.down{color:var(--red)}
    .total-card{min-width:0;padding:7px 9px;background:linear-gradient(180deg,rgba(247,147,26,.09),var(--panel));border:1px solid rgba(247,147,26,.42);border-radius:10px;display:flex;flex-direction:column;justify-content:center}
    .total-title{color:var(--accent);font:600 8px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;text-align:center}
    .total-block+.total-block{border-top:1px solid rgba(247,147,26,.18);margin-top:5px;padding-top:5px}
    .total-label{display:block;color:var(--muted);font:500 7px "IBM Plex Mono",monospace;margin-bottom:2px}
    .total-value{display:block;color:var(--text);font:700 11px "IBM Plex Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .total-sub{display:block;color:var(--muted);font:500 8px "IBM Plex Mono",monospace;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .total-sol{margin-top:auto;padding-top:5px;color:var(--muted);border-top:1px solid rgba(127,138,158,.12);font:500 7px "IBM Plex Mono",monospace;text-align:center;white-space:nowrap}
    .total-sol b{color:#8f9aac;font-weight:600}
    dialog{width:min(390px,calc(100vw - 28px));border:1px solid var(--line2);border-radius:14px;background:var(--panel2);color:var(--text);padding:0;box-shadow:0 20px 70px rgba(0,0,0,.65)}
    dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
    .modal{padding:17px}.modal h2{font-size:16px;margin:0 0 15px}.fields{display:grid;gap:11px}
    .field label{display:block;color:var(--muted);font:500 10px "IBM Plex Mono",monospace;margin-bottom:5px}
    .field input{width:100%;background:#090d14;color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:10px 11px;font:500 13px "IBM Plex Mono",monospace}
    .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.actions button{border-radius:8px;padding:8px 13px;cursor:pointer;font:600 11px "IBM Plex Mono",monospace}
    .cancel{background:transparent;color:var(--muted);border:1px solid var(--line)}.save{background:var(--accent);color:#1a1004;border:1px solid var(--accent)}
    @media(max-width:760px){
      .board,.charts-row,.summary-row{gap:5px}.summary-row{grid-template-columns:minmax(0,1fr) minmax(100px,125px)}.chart-head{padding:0 5px;gap:3px}.symbol{font-size:11px}.price{font-size:8px}.price-jpy{display:none}.change{font-size:7px;padding:2px 3px}.tf{font-size:7px;padding:3px 2px}.data-card{padding:4px 5px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 5px}.metric{padding:3px 0}.metric:nth-child(-n+2){border-top:0}.label,.sub{font-size:6.8px}.value{font-size:8px}.data-title{font-size:7px}.edit{font-size:7px;padding:2px 4px}.screen-btn{width:29px;padding:0;justify-content:center}.screen-btn span{display:none}.total-card{padding:4px 5px}.total-title{font-size:6.5px;margin-bottom:3px}.total-value{font-size:8px}.total-sub,.total-label{font-size:6px}.total-block+.total-block{margin-top:3px;padding-top:3px}.total-sol{font-size:5.8px;padding-top:3px}
    }
    @media(max-height:550px){.topbar{height:28px;margin-bottom:4px}.board{height:calc(100dvh - 43px)}.chart-head{height:32px}.chart{height:calc(100% - 32px)}.metric{padding:2px 0}.data-top{margin-bottom:0}}
    .sale-note{position:absolute;left:8px;z-index:4;font:500 8px "IBM Plex Mono",monospace;color:#ef9299;background:rgba(8,11,18,.85);padding:3px 5px;border-radius:3px;pointer-events:none;max-width:calc(100% - 85px);line-height:1.5}

    html,body{height:100dvh;min-height:0;overflow:hidden}
    .board{height:calc(100dvh - 55px);grid-template-columns:minmax(0,1fr) minmax(300px,360px);grid-template-rows:minmax(0,1fr);gap:8px}
    .charts-row{min-height:0;grid-template-columns:minmax(0,1fr)}
    .summary-row{display:block;min-height:0;overflow:hidden}
    #stockPanel{display:grid;gap:8px;width:100%;transform-origin:top left}
    .data-card{border:0;background:none;padding:0;display:grid;gap:8px}
    .position-hero{background:#141922;border:1px solid #ffffff18;border-radius:11px;padding:12px}
    .data-top{margin-bottom:10px}
    .data-title{font-size:8px;color:#a5b1c4}
    .edit{font-size:8px;padding:3px 6px}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .metric{padding:4px 0;border:0;min-width:0}
    .label{font-size:9px;color:#8c99ac;line-height:14px}
    .value,.sub{display:block;white-space:normal;overflow-wrap:anywhere}
    .hero-grid .value{font-size:25px;font-weight:700;line-height:1.3;letter-spacing:-.6px}
    .hero-grid .sub{font-size:10px;line-height:16px}
    .pnl-percent{display:inline-block;font:600 10px monospace;margin-top:3px}
    .sol-equivalent{text-align:right;color:#f4cf55;font:500 10px monospace;border-top:1px solid #ffffff0b;margin-top:10px;padding-top:7px}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stock-subcard{border:1px solid #ffffff12;background:#0e141d;border-radius:9px;padding:8px 10px;min-width:0}
    .stock-subcard h2,.total-title{font:700 8px monospace;letter-spacing:.07em;color:#8f9db1;margin:0 0 7px}
    .stock-subcard .metric+.metric{border-top:1px solid #ffffff08}
    .stock-subcard .label{font-size:8px;line-height:12px}
    .stock-subcard .value{font-size:12px;line-height:17px}
    .stock-subcard .sub{font-size:9px;line-height:13px}
    .micro-note{font:400 7px/1.5 monospace;color:#728096;margin-top:6px;overflow-wrap:anywhere}
    .total-card{padding:9px 11px;border-color:#f0a13a42}
    .total-title b{color:#f0a13a;font-size:12px;letter-spacing:0;margin-left:5px}
    .pending-badge{float:right;color:#b18b58;border:1px solid #f0a13a35;border-radius:4px;padding:2px 4px;font-size:6px}
    .sale-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .total-block+.total-block{border:0;padding:0;margin:0}
    .total-label{font-size:8px;line-height:14px}
    .total-value{font-size:14px;line-height:19px;white-space:normal;overflow-wrap:anywhere}
    .total-sub{font-size:9px;line-height:14px;white-space:normal}
    @media(max-width:760px) and (orientation:portrait){
      .board{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,46%);gap:6px}
      #stockPanel{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}
      .data-card{display:contents}
      .position-hero{grid-column:1;grid-row:1/3;padding:9px}
      .hero-grid{grid-template-columns:1fr;gap:10px}
      .hero-grid .value{font-size:25px}
      .detail-grid{grid-column:2;grid-row:1;gap:5px}
      .stock-subcard{padding:6px}
      .stock-subcard .value{font-size:10px;line-height:14px}
      .stock-subcard .label{font-size:7px}
      .stock-subcard .sub{font-size:7px;line-height:10px}
      .stock-subcard h2{font-size:6px}
      .total-card{grid-column:2;grid-row:2;padding:6px}
      .total-value{font-size:11px;line-height:15px}
      .total-title{font-size:6px}.total-title b{font-size:10px}
      .pending-badge{font-size:5px;padding:1px 2px}
      .sale-grid{grid-template-columns:1fr;gap:6px}
      .total-sub{font-size:8px;line-height:11px}
    }
    @media(orientation:landscape) and (max-height:550px){
      .board{height:calc(100dvh - 43px);grid-template-columns:minmax(0,1fr) minmax(290px,340px);grid-template-rows:minmax(0,1fr)}
      #stockPanel,.data-card,.detail-grid{gap:5px}
      .position-hero{padding:7px 9px}.data-top{margin-bottom:5px}
      .hero-grid .value{font-size:22px}.hero-grid .sub{font-size:9px;line-height:12px}
      .sol-equivalent{margin-top:5px;padding-top:4px;font-size:8px}
      .stock-subcard{padding:5px 8px}
      .stock-subcard h2,.total-title{margin-bottom:3px;font-size:7px}
      .stock-subcard .metric{padding:2px 0}
      .stock-subcard .value{font-size:10px;line-height:13px}
      .stock-subcard .label,.stock-subcard .sub{font-size:7px;line-height:10px}
      .total-value{font-size:12px;line-height:16px}.total-sub{line-height:11px}
      .micro-note{font-size:6px;line-height:1.3;margin-top:3px}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← Terminal</a>
    <div class="brand">IB · <span>Ações</span></div>
    <div class="live"><i class="led" id="globalLed"></i><span id="globalStatus">conectando</span></div>
    <button class="screen-btn" id="screenBtn" type="button" title="Tela cheia" aria-label="Ativar tela cheia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span>Tela cheia</span>
    </button>
  </div>

  <main class="board" id="board"></main>

  <dialog id="editDialog">
    <form class="modal" id="editForm" method="dialog">
      <h2 id="modalTitle">Editar compra</h2>
      <div class="fields">
        <div class="field"><label for="buyPrice">Preço médio de compra (US$)</label><input id="buyPrice" type="number" min="0" step="any" inputmode="decimal" required></div>
        <div class="field"><label for="quantity">Quantidade comprada</label><input id="quantity" type="number" min="0" step="any" inputmode="decimal" required></div>
      </div>
      <div class="actions"><button class="cancel" value="cancel" type="button" id="cancelBtn">Cancelar</button><button class="save" value="save" type="submit">Salvar</button></div>
    </form>
  </dialog>

<script>
const ASSETS = [
  {id:'hoodx', label:'HOODX', pair:'HOODX-USDT'}
];
// USDT market shown as approximate USD; JPY uses current USD/JPY mid-rate.
const STORE_KEY='ib_hoodx_exact_20261028_v2';
const DEFAULT_POSITIONS={
  hoodx:{buy:4100.128679/46.7035312,sold:0,target:96,qty:46.7035312,paid:4100.128679,date:'28/10/2026'}
};
const state={fx:0,fxSource:"",fxAt:"",fxLoading:false,solPrice:0,positions:JSON.parse(JSON.stringify(DEFAULT_POSITIONS)),views:{},active:null};
const runtime={};
const fmtUSD=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtJPY=new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0});
const nfmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:8});

function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');for(const id of Object.keys(DEFAULT_POSITIONS)){const p=s.positions?.[id];if(p&&+p.buy>0&&+p.qty>0)state.positions[id]={...DEFAULT_POSITIONS[id],...p,sold:DEFAULT_POSITIONS[id].sold,target:DEFAULT_POSITIONS[id].target}}if(s.views&&typeof s.views==='object')state.views=s.views}catch(e){}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify({positions:state.positions,views:state.views}))}catch(e){}}
function money(v){if(!Number.isFinite(v))v=0;return {usd:fmtUSD.format(v),jpy:state.fx?fmtJPY.format(v*state.fx):"—"}}
function signed(v,formatter){const a=formatter(Math.abs(v));return (v>0?'+':v<0?'−':'')+a}
function chartHtml(a){return `<section class="asset" data-id="${a.id}">
  <div class="chart-card">
    <div class="chart-head"><strong class="symbol">${a.label}</strong><span class="price-wrap"><span class="price" data-role="price">—</span><span class="price-jpy" data-role="priceJpy">—</span></span><span class="change" data-role="change">—</span><select class="tf" data-role="tf"><option value="1m">1m</option><option value="15m">15m</option><option value="1h" selected>1h</option><option value="4h">4h</option><option value="1d">1D</option></select></div>
    <div class="chart" data-role="chart"><div data-role="historyStatus" style="position:absolute;z-index:3;left:8px;bottom:24px;font:500 7px monospace;color:#7e8b9d;pointer-events:none"></div><div class="trade-key"><span class="buy-key" data-role="buyKey">COMPRA —</span><span class="sell-key" data-role="sellKey">VENDA —</span></div><div class="sale-note" data-role="saleNote"></div><div class="error" data-role="error">Carregando gráfico…</div></div>
  </div>
</section>`}
function dataHtml(a){return `<div class="data-card" data-info-id="${a.id}">
  <section class="position-hero">
    <div class="data-top"><span class="data-title">${a.label} · POSIÇÃO ABERTA</span><button class="edit" data-role="edit">Editar</button></div>
    <div class="hero-grid">
      <div class="metric"><span class="label">Valor atual</span><span class="value hero-value" data-role="currentUsd">—</span><span class="sub" data-role="currentJpy">—</span></div>
      <div class="metric"><span class="label">PnL em aberto</span><span class="value hero-value pnl" data-role="pnlUsd">—</span><span class="sub pnl" data-role="pnlJpy">—</span><span class="pnl-percent" data-role="pnlPct">—</span></div>
    </div>
    <div class="sol-equivalent"><b id="totalSolEquivalent">— SOL</b></div>
  </section>
  <div class="detail-grid">
    <section class="stock-subcard"><h2>CAPITAL & COMPRA</h2>
      <div class="metric"><span class="label">Investido</span><span class="value" data-role="investedUsd">—</span><span class="sub" data-role="investedJpy">—</span></div>
      <div class="metric"><span class="label">Preço médio</span><span class="value" data-role="buyUsd">—</span><span class="sub" data-role="buyJpy">—</span></div>
    </section>
    <section class="stock-subcard"><h2>MINHA POSIÇÃO</h2>
      <div class="metric"><span class="label">Quantidade HOODX</span><span class="value" data-role="qty">—</span></div>
      <div class="metric"><span class="label">Compra</span><span class="value" data-role="date">—</span></div>
      <div class="micro-note">Taxas adicionais não informadas</div>
    </section>
  </div>
</div>`}
function totalHtml(){return `<section class="total-card stock-subcard" id="totalCard">
 <div class="total-title">ORDEM DE VENDA <b id="saleTarget">—</b><span class="pending-badge">PENDENTE</span></div>
 <div class="sale-grid">
  <div class="total-block"><span class="total-label">Total previsto</span><span class="total-value" id="totalCurrentUsd">—</span><span class="total-sub" id="totalCurrentJpy">—</span></div>
  <div class="total-block"><span class="total-label">Lucro previsto</span><span class="total-value pnl" id="totalPnlUsd">—</span><span class="total-sub pnl" id="totalPnlJpy">—</span></div>
 </div>
 <div class="micro-note">Antes das taxas · USDT ≈ USD · JPY estimado</div>
 <div id="fxStatus" class="micro-note">Consultando USD/JPY…</div>
</section>`}
document.querySelector('#board').innerHTML=`<div class="charts-row">${ASSETS.map(chartHtml).join('')}</div><aside class="summary-row"><div id="stockPanel">${ASSETS.map(dataHtml).join('')}${totalHtml()}</div></aside>`;
loadState();

function chartOptions(){return {
  layout:{background:{color:'transparent'},textColor:'#7f8a9e',fontFamily:"'IBM Plex Mono', monospace",fontSize:10},
  grid:{vertLines:{color:'rgba(29,37,52,.55)'},horzLines:{color:'rgba(29,37,52,.55)'}},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#41b3ff66',style:2},horzLine:{color:'#41b3ff66',style:2}},
  rightPriceScale:{borderColor:'#1d2534',scaleMargins:{top:.08,bottom:.18}},
  timeScale:{borderColor:'#1d2534',timeVisible:true,secondsVisible:false,rightOffset:4,barSpacing:7},

async function getJson(url){

}
function parseBingCandles(d){
 if(!Array.isArray(d)||!d.length)throw Error('Sem candles BingX');
 const rows=d.map(k=>({time:Math.floor(+k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]})).filter(c=>Object.values(c).every(Number.isFinite)&&c.time>0&&c.high>=c.low);

}

async function bingJson(url){
 const urls=[url,url.replace('open-api.bingx.com','open-api.bingx.pro')];

async function loadChart(a,preserveCurrent=true){
  const r=runtime[a.id],err=r.root.querySelector('[data-role="error"]'),firstLoad=!r.candles.length;if(firstLoad){err.textContent='Carregando gráfico…';err.classList.add('show')}

    const tf=r.tf,data=await candles(a.pair,tf);if(tf!==r.tf)return;
    const streamed=r.candles.at(-1),latest=data.at(-1);
    if(r.loadedTf===tf&&streamed&&latest&&streamed.time===latest.time){latest.high=Math.max(latest.high,streamed.high);latest.low=Math.min(latest.low,streamed.low);if(Date.now()-(r.lastTickAt||0)<10000)latest.close=streamed.close}
    r.loadedTf=tf;r.candles=data;r.restoring=true;r.series.setData(r.candles);
    const saved=state.views[a.id]?.[r.tf],wanted=currentRange||saved;
    if(wanted&&Number.isFinite(wanted.from)&&Number.isFinite(wanted.to))r.chart.timeScale().setVisibleLogicalRange(wanted);else r.chart.timeScale().fitContent();

}

function applyTick(a,price,changePct,eventTime=Date.now(),mode="WS"){
  const r=runtime[a.id];if(!Number.isFinite(price)||price<=0)return;r.price=price;r.ok=true;r.lastTickAt=Date.now();r.feedMode=mode;
  if(Number.isFinite(changePct))r.changePct=changePct;
  const last=r.candles.at(-1);if(last&&r.loadedTf===r.tf){const now=Math.floor(eventTime/1000),unit={"1m":60,"15m":900,"1h":3600,"4h":14400,"1d":86400}[r.tf],time=Math.floor(now/unit)*unit;
    if(last.time===time){const c={...last,close:price,high:Math.max(last.high,price),low:Math.min(last.low,price)};r.candles[r.candles.length-1]=c;r.series.update(c)}
    else if(time<last.time){const old=r.candles.find(c=>c.time===time);if(old){old.high=Math.max(old.high,price);old.low=Math.min(old.low,price);r.series.setData(r.candles)}}
    else if(time>last.time){const c={time,open:last.close,high:Math.max(last.close,price),low:Math.min(last.close,price),close:price};r.candles.push(c);r.series.update(c)}

}

  const ch=root.querySelector('[data-role="change"]'),cp=Number.isFinite(r.changePct)?r.changePct:null;
  ch.textContent=cp===null?'—':`${cp>=0?'+':''}${cp.toFixed(2)}%`;ch.className='change '+(cp!==null&&cp>=0?'up':'down');
  const buy=money(+p.buy||0),valuationPrice=+p.sold||price||(+p.buy||0),current=money(valuationPrice*(+p.qty||0)),cost=(+p.paid||((+p.buy||0)*(+p.qty||0))),invested=money(cost),pnl=valuationPrice*(+p.qty||0)-cost,pct=cost?pnl/cost*100:0;
  info.querySelector('[data-role="buyUsd"]').textContent=buy.usd;info.querySelector('[data-role="buyJpy"]').textContent=buy.jpy;
  info.querySelector('[data-role="qty"]').textContent=nfmt.format(+p.qty||0);
  info.querySelector('[data-role="investedUsd"]').textContent=invested.usd;info.querySelector('[data-role="investedJpy"]').textContent=invested.jpy;
  info.querySelector('[data-role="currentUsd"]').textContent=current.usd;info.querySelector('[data-role="currentJpy"]').textContent=current.jpy;
  info.querySelector('[data-role="date"]').textContent=p.date||'28/10/2026';
  const pu=info.querySelector('[data-role="pnlUsd"]'),pj=info.querySelector('[data-role="pnlJpy"]'),cls='pnl '+(pnl>=0?'up':'down');pu.className='value '+cls;pj.className='sub '+cls;
  pu.textContent=signed(pnl,fmtUSD.format.bind(fmtUSD));info.querySelector('[data-role="pnlPct"]').textContent=`${pct>=0?'+':''}${pct.toFixed(2)}%`;info.querySelector('[data-role="pnlPct"]').className='pnl-percent '+(pnl>=0?'up':'down');pj.textContent=(state.fx?signed(pnl*state.fx,fmtJPY.format.bind(fmtJPY)):"—");
}

function syncEntryMarker(a,p){
  const r=runtime[a.id],entry=+p.buy||0;if(r.entryPrice===entry)return;
  if(r.entryLine){try{r.series.removePriceLine(r.entryLine)}catch(e){}r.entryLine=null}
  r.entryPrice=entry;if(!entry)return;
  r.entryLine=r.series.createPriceLine({price:entry,color:'rgba(255,255,255,.94)',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'COMPRA'});
}

function syncExitMarker(a,p){
  const r=runtime[a.id],exit=+p.target||0;if(r.exitPrice===exit)return;
  if(r.exitLine){try{r.series.removePriceLine(r.exitLine)}catch(e){}r.exitLine=null}
  r.exitPrice=exit;if(!exit)return;
  r.exitLine=r.series.createPriceLine({price:exit,color:'#ef5d67',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'ORDEM VENDA'});
}

function renderTotal(){
 const p=state.positions.hoodx,r=runtime.hoodx,cost=+p.paid,expected=p.qty*p.target,profit=expected-cost;
 document.querySelector('#saleTarget').textContent=fmtUSD.format(p.target);
 document.querySelector('#totalCurrentUsd').textContent=fmtUSD.format(expected);
 document.querySelector('#totalCurrentJpy').textContent=state.fx?fmtJPY.format(expected*state.fx):'¥ —';
 const pu=document.querySelector('#totalPnlUsd'),pj=document.querySelector('#totalPnlJpy'),tone=profit>=0?'up':'down';
 pu.className='total-value pnl '+tone;pj.className='total-sub pnl '+tone;
 pu.textContent=signed(profit,fmtUSD.format.bind(fmtUSD))+' · '+(profit>=0?'+':'')+(profit/cost*100).toFixed(2)+'%';
 pj.textContent=state.fx?signed(profit*state.fx,fmtJPY.format.bind(fmtJPY)):'¥ —';
 const current=(r?.price||p.buy)*p.qty;
 document.querySelector('#totalSolEquivalent').textContent=state.solPrice?'≈ '+(current/state.solPrice).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' SOL':'— SOL';
 const size=[...document.querySelectorAll('#stockPanel .value,#stockPanel .sub,#stockPanel .total-value')].map(el=>el.textContent.length).join(',');
 if(fitStockPanel.sizes!==size){fitStockPanel.sizes=size;requestAnimationFrame(fitStockPanel)}
}
function fitStockPanel(){
 const outer=document.querySelector('.summary-row'),inner=document.querySelector('#stockPanel');if(!inner)return;
 inner.style.transform='none';inner.style.width='100%';
 const scale=Math.min(1,(outer.clientHeight-1)/Math.max(1,inner.scrollHeight));
 if(scale<1){inner.style.width=(100/scale)+'%';inner.style.transform='scale('+scale+')'}
}
function renderAll(){ASSETS.forEach(renderAsset);renderTotal()}
function updateGlobalStatus(){const r=runtime.hoodx,fresh=r?.ok&&Date.now()-(r.lastTickAt||0)<15000;document.querySelector('#globalLed').classList.toggle('on',!!fresh);document.querySelector('#globalStatus').textContent=fresh?`BingX · ${r.feedMode||'WS'} · HOODX/USDT`:'BingX · aguardando cotação';}

const dialog=document.querySelector('#editDialog'),form=document.querySelector('#editForm');
function openEditor(a){state.active=a.id;const p=state.positions[a.id];document.querySelector('#modalTitle').textContent=`Editar compra · ${a.label}`;document.querySelector('#buyPrice').value=p.buy||'';document.querySelector('#quantity').value=p.qty||'';dialog.showModal()}
document.querySelector('#cancelBtn').addEventListener('click',()=>dialog.close());
form.addEventListener('submit',e=>{e.preventDefault();if(!state.active)return;const buy=Math.max(0,+document.querySelector('#buyPrice').value||0),qty=Math.max(0,+document.querySelector('#quantity').value||0),old=state.positions[state.active];state.positions[state.active]={...old,buy,qty,paid:buy*qty};saveState();dialog.close();renderAll()});

const screenBtn=document.querySelector('#screenBtn');
async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      const el=document.documentElement;
      if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    }else if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }catch(e){}
}
function syncFullscreenButton(){
  const active=!!(document.fullscreenElement||document.webkitFullscreenElement),label=screenBtn.querySelector('span');
  label.textContent=active?'Sair da tela cheia':'Tela cheia';screenBtn.title=label.textContent;screenBtn.setAttribute('aria-label',label.textContent);
  screenBtn.querySelector('path').setAttribute('d',active?'M9 9H3V3M15 9h6V3M9 15H3v6M15 15h6v6':'M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5');
  setTimeout(()=>window.dispatchEvent(new Event('resize')),80);
}
screenBtn.addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',syncFullscreenButton);document.addEventListener('webkitfullscreenchange',syncFullscreenButton);

function renderFxStatus(failed=false){
  const el=document.querySelector('#fxStatus');
  el.textContent=state.fx?`USD/JPY ${state.fx.toFixed(3)} · ${state.fxSource} · ${state.fxAt}${failed?' · falha ao renovar':''}`:'Câmbio indisponível · valores em JPY aguardando cotação';
}
async function fallbackFx(){
  if(state.fxLoading)return;state.fxLoading=true;
  try{
    const url='https://query1.finance.yahoo.com/v8/finance/chart/JPY%3DX?interval=1m&range=1d';
    let d;try{d=await getJson(url)}catch(e){d=await getJson('https://api.allorigins.win/raw?url='+encodeURIComponent(url))}
    const m=d?.chart?.result?.[0]?.meta;
    if(!(m?.regularMarketPrice>0)||!m.regularMarketTime)throw Error('invalid FX');
    state.fx=+m.regularMarketPrice;state.fxSource='Yahoo Finance';
    state.fxAt=new Date(m.regularMarketTime*1000).toLocaleString('pt-BR',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+' JST';
    renderFxStatus();
  }catch(e){
    // Retain a previous market quote; do not replace it with a daily reference.
    if(!state.fx){
      try{
        const d=await getJson('https://open.er-api.com/v6/latest/USD');
        if(!(d?.rates?.JPY>0)||!d.time_last_update_unix)throw Error('invalid FX');
        state.fx=+d.rates.JPY;state.fxSource='ER-API · referência diária';
        state.fxAt=new Date(d.time_last_update_unix*1000).toLocaleString('pt-BR',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+' JST';
      }catch(f){
        try{const d=await getJson('https://api.frankfurter.dev/v1/latest?base=USD&symbols=JPY');if(!(d?.rates?.JPY>0))throw Error('invalid FX');state.fx=+d.rates.JPY;state.fxSource='Frankfurter · referência diária';state.fxAt=d.date}catch(g){}
      }
    }
    renderFxStatus(true);
  }finally{state.fxLoading=false;renderAll()}
}
function acceptGmoFx(d){
 if(d?.symbol!=='USD_JPY'||!(+d.bid>0)||!(+d.ask>0))return false;
 state.fx=(+d.bid + +d.ask)/2;state.fxSource='GMO Coin · média bid/ask'+(d.status&&d.status!=='OPEN'?' · mercado fechado':'');
 state.fxAt=new Date(d.timestamp).toLocaleString('pt-BR',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' JST';state.gmoAt=Date.now();renderFxStatus();renderAll();return true;
}
let fxSocket,fxReconnect;
function connectFx(){
 clearTimeout(fxReconnect);fxSocket=new WebSocket('wss://forex-api.coin.z.com/ws/public/v1');
 fxSocket.onopen=()=>fxSocket.send(JSON.stringify({command:'subscribe',channel:'ticker',symbol:'USD_JPY'}));
 fxSocket.onmessage=e=>{try{acceptGmoFx(JSON.parse(e.data))}catch(_){} };fxSocket.onerror=()=>fxSocket.close();fxSocket.onclose=()=>{renderFxStatus(true);fxReconnect=setTimeout(connectFx,5000)};
}
async function updateFx(){
 if(Date.now()-(state.gmoAt||0)<10000)return;
 try{const url='https://forex-api.coin.z.com/public/v1/ticker';let d;try{d=await getJson(url)}catch(e){d=await getJson('https://api.allorigins.win/raw?url='+encodeURIComponent(url))}if(!acceptGmoFx(d.data?.find(x=>x.symbol==='USD_JPY')))throw Error('FX indisponível')}
 catch(e){if(!state.fx)await fallbackFx();else renderFxStatus(true)}
}
async function updateSolPrice(){try{const d=await bingJson('https://open-api.bingx.com/openApi/spot/v1/ticker/24hr?symbol=SOL-USDT&timestamp='+Date.now()),t=Array.isArray(d.data)?d.data[0]:d.data;state.solPrice=+t.lastPrice||state.solPrice}catch(e){}renderTotal()}

new ResizeObserver(fitStockPanel).observe(document.querySelector(".summary-row"));
if(document.fonts)document.fonts.ready.then(fitStockPanel);
ASSETS.forEach(initAsset);connectTicker();connectFx();updateFx();updateSolPrice();
setInterval(()=>{renderAll();updateGlobalStatus()},1000);
setInterval(pollBingTicker,10000);
setInterval(()=>ASSETS.forEach(a=>loadChart(a)),60000);
setInterval(updateSolPrice,60000);
setInterval(updateFx,15000);

setInterval(()=>{ASSETS.forEach(renderSaleNote);updateGlobalStatus()},1000);
</script>
