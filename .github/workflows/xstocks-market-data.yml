name: Refresh xStocks public candles
on:
  push:
    branches: [main]
    paths:
      - tools/refresh-xstocks-history.py
      - .github/workflows/xstocks-market-data.yml
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xstocks-market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Open market-data branch
        run: |
          git fetch origin market-data
          git worktree add /tmp/xstocks-market-data origin/market-data
      - name: Fetch public BingX candles
        run: python3 tools/refresh-xstocks-history.py --output /tmp/xstocks-market-data/xstocks-history.json
      - name: Save public snapshot
        working-directory: /tmp/xstocks-market-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xstocks-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public BingX candle history"
          git push origin HEAD:market-data
