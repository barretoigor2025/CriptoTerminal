name: Refresh ETH and SOL holder levels
on:
  schedule:
    - cron: '41 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xstocks-market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Open market-data branch
        run: |
          git fetch origin market-data
          git worktree add /tmp/holder-market-data origin/market-data
          if [ ! -f /tmp/holder-market-data/holder-levels.json ]; then
            cp holder-levels.json /tmp/holder-market-data/
          fi
      - name: Calculate six-month holder levels
        run: python3 tools/refresh-holder-levels.py /tmp/holder-market-data/holder-levels.json
      - name: Publish validated snapshot
        working-directory: /tmp/holder-market-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holder-levels.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh ETH and SOL holder levels"
          git push origin HEAD:market-data
