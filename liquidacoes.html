<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquidações | Cripto Terminal</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#101010;color:#eee}
*{box-sizing:border-box}body{max-width:1440px;margin:auto;padding:18px}
header,.controls,.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
a{color:#ddd}h1{font-size:1.3rem;margin:0}header{margin-bottom:16px}
label{display:flex;align-items:center;gap:6px;color:#ccc}
select,button{font:inherit;color:inherit;background:#222;border:1px solid #555;border-radius:6px;padding:6px 9px}
figure{margin:14px 0 8px;border:1px solid #3a3a3a;border-radius:8px;overflow:hidden;background:#171717}
canvas{width:100%;height:clamp(280px,59vh,650px);display:block}
figcaption{padding:8px 10px;color:#ccc;font-size:.83rem;border-top:1px solid #333}
.legend{font-size:.8rem;color:#bbb;gap:8px}
.ramp{width:75px;height:8px;background:linear-gradient(90deg,#252525,#a0a0a0);border-radius:3px}
</style>
</head>
<body>
<header><a href="index.html">← Terminal</a><h1>Mapa de liquidações</h1></header>
<div class="controls">
<label>Ativo <select id="asset"><option>BTC</option><option>ETH</option><option>SOL</option><option>XRP</option></select></label>
<label>Velas <select id="interval">
<option value="1">1 min</option><option value="3">3 min</option><option value="5">5 min</option>
<option value="15" selected>15 min</option><option value="30">30 min</option><option value="60">1 h</option>
<option value="120">2 h</option><option value="240">4 h</option><option value="360">6 h</option>
<option value="720">12 h</option><option value="D">1 dia</option><option value="W">1 semana</option>
</select></label>
<label>Histórico <select id="history"><option value="120">120 velas</option><option value="250" selected>250 velas</option><option value="500">500 velas</option></select></label>
<button id="refresh" type="button">Atualizar</button>
</div>
<figure>
<canvas id="chart" role="img" aria-label="Gráfico de velas com intensidade estimada de liquidação por preço e horário"></canvas>
<figcaption id="status" role="status">Carregando cotações…</figcaption>
</figure>
<div class="legend"><span>Intensidade relativa baixa</span><span class="ramp"></span><span>alta</span><span>· Candle preenchido indica queda</span></div>
<p class="legend">Zonas estimadas pelo volume das velas dos perpétuos USDT da Bybit e alavancagens de 10×, 25×, 50× e 100×. A faixa perde intensidade quando o preço cruza o nível. Horários do Japão.</p>
<script>
const asset = document.getElementById('asset');
const interval = document.getElementById('interval');
const historySize = document.getElementById('history');
const refresh = document.getElementById('refresh');
const status = document.getElementById('status');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const dateFormat = new Intl.DateTimeFormat('pt-BR', {
  timeZone:'Asia/Tokyo', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'
});
let controller, map, pointer;

function buildMap(candles) {
  const rows = 120;
  const min = Math.min(...candles.map(candle => candle.low)) * 0.995;
  const max = Math.max(...candles.map(candle => candle.high)) * 1.005;
  const step = (max - min) / rows;
  const volumeMax = Math.max(1, ...candles.map(candle => candle.volume));
  const cells = candles.map(() => new Float64Array(rows));
  let active = [];
  let peak = 0;
  candles.forEach((candle, column) => {
    active = active.filter(zone => zone.long ? candle.low > zone.price : candle.high < zone.price);
    const entry = (candle.high + candle.low + candle.close) / 3;
    for (const leverage of [10, 25, 50, 100]) {
      for (const long of [true, false]) {
        const price = entry * (1 + (long ? -1 : 1) * 0.985 / leverage);
        const row = Math.floor((price - min) / step);
        if (row >= 0 && row < rows) active.push({price, row, long, weight:candle.volume / volumeMax});
      }
    }
    for (const zone of active) {
      cells[column][zone.row] += zone.weight;
      peak = Math.max(peak, cells[column][zone.row]);
    }
  });
  return {min, max, step, rows, peak, cells, candles};
}

function draw() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  if (!map || width < 100) return;
  const {min, max, step, rows, peak, cells, candles} = map;
  const top = 14, left = 8, right = width - 73, bottom = height - 30;
  const stride = (right - left) / candles.length;
  const y = price => bottom - (price - min) / (max - min) * (bottom - top);
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#bbb';
  for (let i = 0; i <= 5; i++) {
    const price = min + (max - min) * i / 5;
    ctx.fillRect(left, y(price), right - left, 0.3);
    ctx.fillText(price.toLocaleString('en-US', {maximumFractionDigits: price < 10 ? 4 : 2}), right + 7, y(price) + 4);
  }
  candles.forEach((candle, column) => {
    const x = left + stride * column;
    const rowHeight = y(min) - y(min + step);
    for (let row = 0; row < rows; row++) {
      const strength = peak && Math.sqrt(cells[column][row] / peak);
      if (strength < 0.03) continue;
      ctx.fillStyle = 'rgba(210,210,210,' + strength * 0.63 + ')';
      ctx.fillRect(x, y(min + step * (row + 1)), stride, rowHeight);
    }
    const center = x + stride / 2;
    const bodyTop = Math.min(y(candle.open), y(candle.close));
    const bodyHeight = Math.max(1, Math.abs(y(candle.open) - y(candle.close)));
    const bodyWidth = Math.max(0.7, stride * 0.66);
    ctx.fillStyle = '#eee';
    ctx.fillRect(center - 0.4, y(candle.high), 0.8, y(candle.low) - y(candle.high));
    ctx.fillRect(center - bodyWidth / 2, bodyTop, bodyWidth, bodyHeight);
    if (candle.close >= candle.open && bodyWidth > 2 && bodyHeight > 2) {
      ctx.fillStyle = '#171717';
      ctx.fillRect(center - bodyWidth / 2 + 1, bodyTop + 1, bodyWidth - 2, bodyHeight - 2);
    }
  });
  ctx.fillStyle = '#bbb';
  const ticks = Math.max(1, Math.floor((right - left) / 105));
  for (let i = 0; i < ticks; i++) {
    const column = Math.floor(i * candles.length / ticks);
    ctx.fillText(dateFormat.format(candles[column].time), left + column * stride, bottom + 19);
  }
  if (!pointer || pointer.x < left || pointer.x >= right || pointer.y < top || pointer.y > bottom) return;
  const column = Math.floor((pointer.x - left) / stride);
  const price = max - (pointer.y - top) / (bottom - top) * (max - min);
  const row = Math.min(rows - 1, Math.max(0, Math.floor((price - min) / step)));
  const intensity = peak ? Math.round(cells[column][row] / peak * 100) : 0;
  ctx.fillStyle = '#aaa';
  ctx.fillRect(pointer.x, top, 1, bottom - top);
  ctx.fillRect(left, pointer.y, right - left, 1);
  const detail = dateFormat.format(candles[column].time) + ' · ' + price.toFixed(price < 10 ? 4 : 2) + ' USDT · ' + intensity + '%';
  const labelWidth = ctx.measureText(detail).width + 12;
  ctx.fillStyle = '#101010';
  ctx.fillRect(left, top, labelWidth, 21);
  ctx.fillStyle = '#fff';
  ctx.fillText(detail, left + 6, top + 14);
}

async function load(reset = false) {
  controller?.abort();
  const request = new AbortController();
  controller = request;
  if (reset) {
    map = pointer = null;
    draw();
  }
  const symbol = asset.value + 'USDT';
  status.textContent = 'Carregando ' + symbol + '…';
  const params = new URLSearchParams({category:'linear', symbol, interval:interval.value, limit:historySize.value});
  const timeout = setTimeout(() => request.abort(), 12000);
  try {
    const response = await fetch('https://api.bybit.com/v5/market/kline?' + params, {signal:request.signal, cache:'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (data.retCode !== 0 || !data.result?.list?.length) throw new Error('Sem velas');
    const candles = data.result.list.map(row => {
      const [time, open, high, low, close, volume] = row.map(Number);
      return {time, open, high, low, close, volume};
    }).reverse();
    if (controller !== request) return;
    map = buildMap(candles);
    status.textContent = symbol + ' · ' + candles.length + ' velas · atualizado às ' +
      new Date().toLocaleTimeString('pt-BR', {timeZone:'Asia/Tokyo'}) + ' JST';
    draw();
  } catch (error) {
    if (controller !== request) return;
    status.textContent = 'Falha ao atualizar ' + symbol + ' pela Bybit. Use Atualizar para tentar de novo.';
  } finally {
    clearTimeout(timeout);
  }
}
for (const control of [asset, interval, historySize]) control.addEventListener('change', () => load(true));
refresh.addEventListener('click', () => load());
canvas.addEventListener('pointermove', event => {
  const bounds = canvas.getBoundingClientRect();
  pointer = {x:event.clientX - bounds.left, y:event.clientY - bounds.top};
  draw();
});
canvas.addEventListener('pointerleave', () => { pointer = null; draw(); });
new ResizeObserver(draw).observe(canvas);
setInterval(() => { if (!document.hidden) load(); }, 30000);
load();
</script>
</body>
</html>
