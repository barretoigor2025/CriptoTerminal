<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Entregas — Monitoramento de Linhas</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a3340;
    --txt:#e6edf3; --muted:#8b98a5; --accent:#3b82f6;
    --verde:#22c55e; --amarelo:#eab308; --vermelho:#ef4444; --cinza:#64748b; --azul:#38bdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Noto Sans JP',Arial,sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#161b22,#12161c);
    border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#22c55e);display:grid;place-items:center;font-size:17px}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .tabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tabs button{border:0;background:transparent;color:var(--muted);font-weight:600;padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
  .tabs button.active{background:var(--accent);color:#fff}
  .langbtn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:13px}
  .clock{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
  .clock .time{font-size:23px;font-weight:700;letter-spacing:1px}
  .clock .date{font-size:11px;color:var(--muted);text-transform:capitalize}
  main{padding:14px;max-width:1500px;margin:0 auto}

  /* barra do dia */
  .daybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
  .daynav{display:flex;gap:8px}
  .daynav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px;cursor:pointer}
  .dayinfo{min-width:180px}
  .dayinfo .big{font-size:17px;font-weight:800;text-transform:capitalize}
  .dayinfo .small{font-size:12px;color:var(--muted)}
  input[type=date],input[type=time],input[type=number],input[type=text],select,input[type=search]{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:9px;font-size:13px;outline:none;font-family:inherit}
  .btn{background:var(--accent);border:0;color:#fff;font-weight:600;padding:9px 13px;border-radius:9px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
  .btn.small{padding:6px 10px;font-size:12px}
  .btn.verde{background:var(--verde)} .btn.azul{background:var(--azul);color:#04222e}
  .btn.warn{background:#a16207}
  .spacer{margin-left:auto}
  .tol{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .tol input{width:56px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
  .tile:hover{border-color:var(--accent)} .tile.sel{outline:2px solid var(--accent)}
  .tile .dot{width:13px;height:13px;border-radius:4px}
  .tile .n{font-size:26px;font-weight:800;line-height:1}
  .tile .lbl{font-size:12px;color:var(--muted);margin-top:2px}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  #busca{min-width:200px}

  /* cards por Bin */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;align-items:start}
  .bincard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 30px;border-left:6px solid var(--cinza);position:relative;min-width:0}
  .bincard.verde{border-left-color:var(--verde)} .bincard.amarelo{border-left-color:var(--amarelo)}
  .bincard.vermelho{border-left-color:var(--vermelho)} .bincard.cinza{border-left-color:var(--cinza)}
  .bc-top{display:flex;align-items:center;gap:12px}
  .bc-titles{flex:1;min-width:0}
  .bc-linha{font-size:19px;font-weight:800;line-height:1.2}
  .bc-linha .mot{font-weight:600;color:var(--muted)} .bc-linha .mot::before{content:"· "}
  .bc-turno{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:2px}
  .bc-bin{font-size:19px;font-weight:800;letter-spacing:.3px;white-space:nowrap;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.45);color:#93c5fd;padding:4px 12px;border-radius:10px}
  @keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--halo),0 0 12px 3px var(--halo)}50%{box-shadow:0 0 0 3px transparent,0 0 3px 0 var(--halo)}}
  .luz{width:24px;height:24px;border-radius:50%;flex:0 0 auto;background:var(--cinza);box-shadow:0 0 0 3px var(--halo)}
  .luz.on{animation:glow 1.4s infinite}
  .horarios{display:flex;align-items:flex-end;gap:14px;margin:16px 0 12px}
  .hbox .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .hbox .hh{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .harrow{color:var(--muted);font-size:18px;padding-bottom:3px}
  .estado{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
  .estado .ic{font-size:14px}
  .estado-sub{font-size:12px;color:var(--muted);margin-top:4px}
  .horarios .hbox .cap{font-size:8px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);opacity:.7}
  .registro{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .registro .rk{font-size:9px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .registro .rv{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);font-size:14px}
  .registro .rv.ok{color:#4ade80}
  .registro .rarrow{color:var(--muted)}

  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill.verde{background:rgba(34,197,94,.15);color:#4ade80} .pill.amarelo{background:rgba(234,179,8,.15);color:#facc15}
  .pill.vermelho{background:rgba(239,68,68,.15);color:#f87171} .pill.cinza{background:rgba(100,116,139,.18);color:#94a3b8}
  .pill.azul{background:rgba(56,189,248,.15);color:#7dd3fc}

  .empty{text-align:center;color:var(--muted);padding:44px 16px;grid-column:1/-1}
  .hidden{display:none!important}
  .footnote{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.6}

  /* ==== Aba Programação ==== */
  .reg-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
  .reg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .reg h4{font-size:13px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
  .chip b{font-weight:700}
  .chip .x{cursor:pointer;color:var(--muted)} .chip .x:hover{color:var(--vermelho)}
  .reg-add{display:flex;gap:7px}
  .reg-add input{flex:1;min-width:0}

  .weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:16px}
  .weekbar .wk{font-weight:800;font-size:15px;min-width:220px}
  .weekbar .wk small{display:block;font-weight:500;color:var(--muted);font-size:12px}

  .lineblock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  .lineblock h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .shift{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .shift.dia{border-color:rgba(234,179,8,.4)} .shift.noite{border-color:rgba(56,189,248,.4)}
  .shift-h{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .asgn{display:grid;grid-template-columns:64px 92px 92px 1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:7px}
  .asgn label{display:none}
  .asgn .rm{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;height:34px;cursor:pointer}
  .asgn .rm:hover{color:var(--vermelho)}
  .asgn-head{display:grid;grid-template-columns:64px 92px 92px 1fr 1fr 34px;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:5px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:460px}
  .modal h3{margin-bottom:14px;font-size:17px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}

  /* driver */
  .driver-login{max-width:420px;margin:36px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
  .driver-header{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#22c55e);display:grid;place-items:center;font-weight:800;font-size:17px}
  .trip-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;border-left:6px solid var(--cinza)}
  .trip-card.verde{border-left-color:var(--verde)} .trip-card.amarelo{border-left-color:var(--amarelo)}
  .trip-card.vermelho{border-left-color:var(--vermelho)} .trip-card.azul{border-left-color:var(--azul)}
  .trip-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
  .trip-title{font-weight:800;font-size:15px}
  .trip-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin-bottom:12px}
  .trip-meta .k{color:var(--muted);font-size:11px;text-transform:uppercase}
  .trip-meta .val{font-weight:700}
  .trip-actions{display:flex;gap:10px;flex-wrap:wrap}
  .trip-actions .btn{flex:1;justify-content:center;padding:11px}
  .done-stamp{font-size:12px;color:#4ade80;font-weight:700}

  /* ===== celular: 3 cards por linha, ultra compactos ===== */
  @media(max-width:820px){
    .clock .time{font-size:18px}
    .board{grid-template-columns:repeat(3,1fr);gap:7px}
    .bincard{padding:9px 8px 18px;border-left-width:4px;border-radius:12px}
    .bc-top{display:block}
    .bc-linha{font-size:12px;line-height:1.15;padding-right:16px}
    .bc-linha .mot{display:block} .bc-linha .mot::before{content:""}
    .bc-turno{font-size:8px;white-space:nowrap;margin-top:1px}
    .bc-bin{font-size:10px;padding:1px 6px;border-radius:6px;display:inline-block;margin-top:5px}
    .luz{position:absolute;top:8px;right:8px;width:13px;height:13px;box-shadow:0 0 0 2px var(--halo)}
    .horarios{flex-direction:column;align-items:stretch;gap:1px;margin:8px 0 6px}
    .harrow{display:none}
    .hbox{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
    .hbox .lbl{font-size:7px}
    .hbox .hh{font-size:15px}
    .estado{font-size:10px;gap:3px;line-height:1.15}
    .estado .ic{font-size:9px}
    .estado-sub{font-size:8px;margin-top:2px}
    .asgn,.asgn-head{grid-template-columns:44px 74px 74px 1fr 1fr 30px;gap:5px}
    .tiles{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">🚚</div>
    <div data-i18n="app_title">Painel de Entregas
      <small data-i18n="app_sub">Monitoramento de linhas em tempo real</small>
    </div>
  </div>
  <div class="tabs">
    <button id="tabPainel" class="active" onclick="setTab('painel')">🖥️ <span data-i18n="tab_painel">Painel</span></button>
    <button id="tabProg" onclick="setTab('prog')">🗓️ <span data-i18n="tab_prog">Programação</span></button>
  </div>
  <button class="langbtn" id="langBtn" onclick="toggleLang()">日本語</button>
  <div class="clock">
    <div class="time" id="clock">--:--:--</div>
    <div class="date" id="today">—</div>
  </div>
</header>

<main>
  <!-- ============ ABA PAINEL ============ -->
  <section id="viewPainel">
    <div class="tabs" style="margin-bottom:14px;width:max-content">
      <button id="btnCoord" class="active" onclick="setMode('coord')">🖥️ <span data-i18n="mode_coord">Coordenador</span></button>
      <button id="btnDriver" onclick="setMode('driver')">📱 <span data-i18n="mode_driver">Motorista</span></button>
    </div>

    <!-- Coordenador -->
    <div id="modeCoord">
      <div class="daybar">
        <div class="daynav">
          <button onclick="mudarDia(-1)">‹</button><button onclick="mudarDia(1)">›</button>
        </div>
        <div class="dayinfo"><div class="big" id="dayBig">—</div><div class="small" id="daySmall">—</div></div>
        <input type="date" id="datePick" onchange="setDia(this.value)">
        <button class="btn" onclick="irHoje()" data-i18n="hoje">Hoje</button>
        <div class="spacer"></div>
        <button class="btn ghost small" onclick="carregarExemplo()" data-i18n="exemplo">Dados de exemplo</button>
        <button class="btn ghost small" onclick="simularAoVivo()" data-i18n="simular">Simular ao vivo</button>
      </div>

      <div class="tiles">
        <div class="tile" data-f="verde" onclick="filtrarTile('verde')"><span class="dot" style="background:var(--verde)"></span><div><div class="n" id="cVerde">0</div><div class="lbl" data-i18n="t_verde">No horário / confirmado</div></div></div>
        <div class="tile" data-f="amarelo" onclick="filtrarTile('amarelo')"><span class="dot" style="background:var(--amarelo)"></span><div><div class="n" id="cAmarelo">0</div><div class="lbl" data-i18n="t_amarelo">Aguardando confirmação</div></div></div>
        <div class="tile" data-f="vermelho" onclick="filtrarTile('vermelho')"><span class="dot" style="background:var(--vermelho)"></span><div><div class="n" id="cVermelho">0</div><div class="lbl" data-i18n="t_vermelho">Atrasado</div></div></div>
        <div class="tile" data-f="cinza" onclick="filtrarTile('cinza')"><span class="dot" style="background:var(--cinza)"></span><div><div class="n" id="cAgendado">0</div><div class="lbl" data-i18n="t_cinza">Agendado</div></div></div>
      </div>

      <div class="controls">
        <input type="search" id="busca" oninput="render()" data-i18n-ph="buscar" placeholder="Buscar linha, motorista, caminhão…">
        <div class="tol"><span data-i18n="tolerancia">Tolerância (amarelo):</span>
          <input type="number" id="tol" min="0" max="30" value="1" onchange="salvarTol()"> <span data-i18n="min">min</span></div>
        <div class="spacer"></div><span id="filtroAtivo" class="hidden"></span>
      </div>

      <div class="board" id="board"></div>
      <p class="footnote" id="foot"></p>
    </div>

    <!-- Motorista -->
    <div id="modeDriver" class="hidden">
      <div id="driverLogin" class="driver-login">
        <h2 data-i18n="app_motorista">App do Motorista</h2>
        <p style="color:var(--muted);font-size:13px;margin:6px 0 16px" data-i18n="selecione_nome">Selecione seu nome para ver suas entregas de hoje.</p>
        <div class="field"><select id="driverSelect" style="width:100%;padding:12px"></select></div>
        <button class="btn" style="width:100%;justify-content:center;padding:12px" onclick="entrarMotorista()" data-i18n="entrar">Entrar</button>
      </div>
      <div id="driverPanel" class="hidden">
        <div class="driver-header">
          <div class="avatar" id="dAvatar">M</div>
          <div style="flex:1"><div style="font-weight:800;font-size:16px" id="dNome">—</div><div id="dResumo" style="color:var(--muted);font-size:12px">—</div></div>
          <button class="btn ghost small" onclick="sairMotorista()" data-i18n="trocar">Trocar</button>
        </div>
        <div id="driverTrips"></div>
      </div>
    </div>
  </section>

  <!-- ============ ABA PROGRAMAÇÃO ============ -->
  <section id="viewProg" class="hidden">
    <div class="reg-wrap">
      <div class="reg">
        <h4>📍 <span data-i18n="linhas">Linhas</span></h4>
        <div class="chips" id="chipsLinhas"></div>
        <div class="reg-add"><input type="text" id="addLinhaInp" data-i18n-ph="nome_linha" placeholder="Nome da linha"><button class="btn small" onclick="addLinha()" data-i18n="add">Adicionar</button></div>
      </div>
      <div class="reg">
        <h4>👷 <span data-i18n="motoristas">Motoristas</span></h4>
        <div class="chips" id="chipsMotoristas"></div>
        <div class="reg-add"><input type="text" id="addMotInp" data-i18n-ph="nome_motorista" placeholder="Nome do motorista"><button class="btn small" onclick="addMotorista()" data-i18n="add">Adicionar</button></div>
      </div>
      <div class="reg">
        <h4>🚛 <span data-i18n="caminhoes">Caminhões</span></h4>
        <div class="chips" id="chipsCaminhoes"></div>
        <div class="reg-add"><input type="text" id="addCamInp" data-i18n-ph="numero_caminhao" placeholder="Número / placa"><button class="btn small" onclick="addCaminhao()" data-i18n="add">Adicionar</button></div>
      </div>
    </div>

    <div class="weekbar">
      <div class="daynav"><button onclick="mudarSemana(-1)">‹</button><button onclick="mudarSemana(1)">›</button></div>
      <div class="wk" id="wkLabel">—<small id="wkSub">—</small></div>
      <input type="date" id="weekPick" onchange="setSemana(this.value)">
      <div class="spacer"></div>
      <button class="btn ghost small" onclick="replicarProx()" data-i18n="replicar">Replicar próxima semana</button>
      <button class="btn ghost small" onclick="expandirSemanas()" data-i18n="expandir">Expandir semanas</button>
      <button class="btn warn small" onclick="trocarTurnos()" data-i18n="trocar_turnos">Trocar turnos</button>
    </div>

    <div id="progEditor"></div>
  </section>
</main>

<!-- modal genérico (expandir) -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">—</h3>
    <div class="field"><label id="modalLabel">—</label><input type="number" id="modalInput" min="1" max="52" value="4"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="fecharModal()" data-i18n="cancelar">Cancelar</button>
      <button class="btn" id="modalOk" data-i18n="confirmar">Confirmar</button>
    </div>
  </div>
</div>

<script>
/* ================= i18n ================= */
const I18N={
 pt:{
  app_title:'Painel de Entregas',app_sub:'Monitoramento de linhas em tempo real',
  tab_painel:'Painel',tab_prog:'Programação',mode_coord:'Coordenador',mode_driver:'Motorista',
  hoje:'Hoje',exemplo:'Dados de exemplo',simular:'Simular ao vivo',
  t_verde:'No horário / confirmado',t_amarelo:'Aguardando confirmação',t_vermelho:'Atrasado',t_cinza:'Agendado',
  buscar:'Buscar linha, motorista, caminhão…',tolerancia:'Tolerância (amarelo):',min:'min',
  entrada:'Entrada',saida:'Saída',previsto:'Previsto',real:'Real',registrado:'Registrado',
  app_motorista:'App do Motorista',selecione_nome:'Selecione seu nome para ver suas entregas de hoje.',entrar:'Entrar',trocar:'Trocar',
  linhas:'Linhas',motoristas:'Motoristas',caminhoes:'Caminhões',add:'Adicionar',
  nome_linha:'Nome da linha',nome_motorista:'Nome do motorista',numero_caminhao:'Número / placa',
  replicar:'Replicar próxima semana',expandir:'Expandir semanas',trocar_turnos:'Trocar turnos',
  cancelar:'Cancelar',confirmar:'Confirmar',

function aplicarIdioma(){

  $('langBtn').textContent = lang==='pt'?'日本語':'PT';

function toggleLang(){ lang = lang==='pt'?'ja':'pt'; store.set(LS_LANG,lang); aplicarIdioma(); }

/* ================= Estado / storage ================= */
const LS_KEY='painelEntregas.v6', LS_TOL='painelEntregas.tol', LS_LANG='painelEntregas.lang';
let cfg={linhas:[],motoristas:[],caminhoes:[]};
let escala={};          // escala[weekKey] = [assignment...]
let confirmacoes={};    // confirmacoes[dateStr][assignId] = {confEntrada,confDescarga}
let tab='painel', mode='coord', motoristaAtual=null;
let selectedDate, selectedWeek, filtroStatus='';

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const _mem={};
const store={ get(k){try{return localStorage.getItem(k)}catch(e){return k in _mem?_mem[k]:null}},
              set(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=v}} };

function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function ymdHoje(){ return ymd(new Date()); }
function quando(dataStr,hhmm){ const [Y,Mo,D]=dataStr.split('-').map(Number); const [h,m]=hhmm.split(':').map(Number); return new Date(Y,Mo-1,D,h,m,0,0); }
function saidaDate(v){ let d=quando(v.data,v.saida); if(v.saida<=v.entrada) d=new Date(d.getTime()+86400000); return d; } // vira meia-noite (turno noite)
function fmtHora(d){ return d?`${pad(d.getHours())}:${pad(d.getMinutes())}`:'—'; }
function fmtHoraSeg(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function tolMin(){ return Math.max(0,parseInt($('tol').value)||0); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* semanas (segunda-feira como início) */
function weekKeyOf(dateStr){ const [Y,M,D]=dateStr.split('-').map(Number); const d=new Date(Y,M-1,D);
  const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return ymd(d); }
function weekDates(wk){ const [Y,M,D]=wk.split('-').map(Number); const b=new Date(Y,M-1,D);
  return [...Array(7)].map((_,i)=>{const x=new Date(b);x.setDate(b.getDate()+i);return ymd(x);}); }
function addDaysStr(dateStr,n){ const [Y,M,D]=dateStr.split('-').map(Number); const d=new Date(Y,M-1,D); d.setDate(d.getDate()+n); return ymd(d); }

/* ================= Semáforo ================= */
function estado(v){
  const agora=new Date(), entrada=quando(v.data,v.entrada), saida=saidaDate(v);
  const tolMs=tolMin()*60000, C={verde:'#22c55e',amarelo:'#eab308',vermelho:'#ef4444',cinza:'#64748b'};
  if(v.confDescarga){
    if(v.confDescarga.getTime()<=saida.getTime()+tolMs) return {cat:'verde',luz:C.verde,ic:'✅',titulo:t('st_fin_prazo'),sub:`${t('sub_descarga_conf')} ${fmtHora(v.confDescarga)}`,on:false};
    const min=Math.round((v.confDescarga-saida)/60000); return {cat:'vermelho',luz:C.vermelho,ic:'⛔',titulo:t('st_fin_atraso'),sub:`${fmtHora(v.confDescarga)} · +${min} min`,on:false};
  }
  if(v.confEntrada){
    if(agora.getTime()>saida.getTime()+tolMs) return {cat:'vermelho',luz:C.vermelho,ic:'🔴',titulo:t('st_descarga_atraso'),sub:`${t('sub_entrou')} ${fmtHora(v.confEntrada)} · ${t('sub_passou')}`,on:true};
    if(v.confEntrada.getTime()<=entrada.getTime()+tolMs) return {cat:'verde',luz:C.verde,ic:'🟢',titulo:t('st_entrou_horario'),sub:`${t('sub_em_descarga')} ${fmtHora(v.confEntrada)}`,on:false};
    const min=Math.round((v.confEntrada-entrada)/60000); return {cat:'amarelo',luz:C.amarelo,ic:'🟡',titulo:t('st_entrou_atraso'),sub:`${t('sub_entrou')} ${fmtHora(v.confEntrada)} · +${min} min`,on:false};
  }
  if(agora<entrada) return {cat:'cinza',luz:C.cinza,ic:'⚪',titulo:t('st_agendado'),sub:`${t('sub_prev')} ${v.entrada}`,on:false};
  if(agora.getTime()<=entrada.getTime()+tolMs) return {cat:'amarelo',luz:C.amarelo,ic:'🟡',titulo:t('st_aguardando'),sub:t('sub_confirmar_app'),on:true};
  const min=Math.floor((agora-entrada)/60000); return {cat:'vermelho',luz:C.vermelho,ic:'🔴',titulo:t('st_atrasado'),sub:`${min} ${t('sub_sem_confirmar')}`,on:true};
}
function statusGeral(v){ return estado(v).cat; }

/* ================= Derivar bins do dia a partir da escala ================= */
function binsDoDia(dateStr){
  const wk=weekKeyOf(dateStr); const [Y,M,D]=dateStr.split('-').map(Number); const dow=new Date(Y,M-1,D).getDay();
  const arr=(escala[wk]||[]).filter(a=>(a.dias||[1,2,3,4,5,6]).includes(dow));
  return arr.map(a=>{ const conf=(confirmacoes[dateStr]||{})[a.id]||{};
    return {...a, data:dateStr, viagem:a.bin,
      confEntrada:conf.confEntrada?new Date(conf.confEntrada):null,
      confDescarga:conf.confDescarga?new Date(conf.confDescarga):null }; });
}

/* ================= Persistência ================= */
function salvar(){ store.set(LS_KEY, JSON.stringify({cfg,escala,confirmacoes})); }
function carregar(){
  const raw=store.get(LS_KEY);
  if(!raw){ carregarExemplo(true); return; }
  try{ const o=JSON.parse(raw);
    if(!o||!o.cfg){ carregarExemplo(true); return; }
    cfg=o.cfg; escala=o.escala||{}; confirmacoes=o.confirmacoes||{};
  }catch(e){ carregarExemplo(true); }
}
function salvarTol(){ store.set(LS_TOL,$('tol').value); render(); }

/* ================= Exemplo ================= */
function carregarExemplo(silent){
  if(!silent && !confirm(lang==='ja'?'サンプルを再読込しますか？現在の内容は置き換わります。':'Recarregar exemplo? Substitui o conteúdo atual.')) return;
  const agora=new Date();
  const hm=off=>{ const d=new Date(agora.getTime()+off*60000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  cfg={ linhas:['Yoshiwara','Serra Azul','Centro','Litoral'],
        motoristas:['Vini','Marcos','Rafael','Cláudia','Pedro','João'],
        caminhoes:['ABC-1D23','DEF-2G45','GHI-3J67','JKL-4M89','MNO-5P01'] };
  const wk=weekKeyOf(ymdHoje()); const hoje=ymdHoje();
  const A=(linha,bin,turno,ent,sai,mot,cam)=>({id:uid(),linha,bin,turno,entrada:ent,saida:sai,motorista:mot,caminhao:cam,dias:[0,1,2,3,4,5,6]});
  escala={}; escala[wk]=[
    A('Yoshiwara',2,'dia','07:40','08:00','Vini','ABC-1D23'),
    A('Yoshiwara',11,'dia',hm(35),hm(60),'Vini','ABC-1D23'),
    A('Serra Azul',4,'dia',hm(-10),hm(15),'Marcos','DEF-2G45'),
    A('Centro',1,'dia',hm(-8),hm(12),'Rafael','GHI-3J67'),
    A('Litoral',9,'dia',hm(-20),hm(10),'Cláudia','JKL-4M89'),
    A('Yoshiwara',5,'noite','22:00','23:30','Pedro','MNO-5P01'),
    A('Serra Azul',7,'noite','23:00','00:30','João','DEF-2G45'),
  ];
  // confirmações de hoje p/ mostrar variedade de luzes
  const at=off=> agora.getTime()+off*60000;
  const byBin={}; escala[wk].forEach(a=>byBin[a.linha+'#'+a.bin]=a);
  confirmacoes={}; confirmacoes[hoje]={};
  confirmacoes[hoje][byBin['Yoshiwara#2'].id]={confEntrada:quando(hoje,'07:41').getTime(),confDescarga:quando(hoje,'07:58').getTime()}; // finalizado no prazo
  confirmacoes[hoje][byBin['Serra Azul#4'].id]={confEntrada:at(-9)};   // entrou no horário
  confirmacoes[hoje][byBin['Litoral#9'].id]={confEntrada:at(-14)};      // entrou atrasado
  salvar();
}

  $('today').textContent=d.toLocaleDateString(lang==='ja'?'ja-JP':'pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

function atualizaBarraDia(){ const [Y,Mo,D]=selectedDate.split('-').map(Number); const d=new Date(Y,Mo-1,D);

  $('dayBig').textContent=d.toLocaleDateString(loc,{weekday:'long'});

/* ================= Filtro tiles ================= */
function filtrarTile(cor){ filtroStatus=(filtroStatus===cor)?'':cor;
  document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('sel',x.dataset.f===filtroStatus)); render(); }

/* ================= RENDER PAINEL ================= */
function render(){ if(tab!=='painel') return; if(mode==='coord') renderCoord(); else renderDriver(); }
function renderCoord(){
  atualizaBarraDia();
  const q=($('busca').value||'').toLowerCase();
  const doDia=binsDoDia(selectedDate);
  let c={verde:0,amarelo:0,vermelho:0,cinza:0}; doDia.forEach(v=>c[statusGeral(v)]++);
  $('cVerde').textContent=c.verde;$('cAmarelo').textContent=c.amarelo;$('cVermelho').textContent=c.vermelho;$('cAgendado').textContent=c.cinza;
  let lista=doDia.filter(v=>{ const txt=`${v.linha} ${v.motorista} ${v.caminhao} ${v.bin}`.toLowerCase();
    if(q&&!txt.includes(q))return false; if(filtroStatus&&statusGeral(v)!==filtroStatus)return false; return true; });
  const ord={vermelho:0,amarelo:1,verde:2,cinza:3};
  lista.sort((a,b)=>ord[statusGeral(a)]-ord[statusGeral(b)]||a.entrada.localeCompare(b.entrada));
  const board=$('board');
  if(!lista.length){ board.innerHTML=`<div class="empty">${t('nenhum_bin')}</div>`; }
  else board.innerHTML=lista.map(v=>{ const st=estado(v);
    const turnoLbl = v.turno==='noite'?('🌙 '+t('turno_noite')):('☀️ '+t('turno_dia'));
    return `<div class="bincard ${st.cat}">
      <div class="bc-top">
        <div class="bc-titles"><div class="bc-linha">${esc(v.linha)}<span class="mot">${esc(v.motorista)}</span></div>
          <div class="bc-turno">${turnoLbl}</div></div>
        <span class="bc-bin">${t('bin').toUpperCase()} ${esc(v.bin)}</span>
        <span class="luz ${st.on?'on':''}" style="background:${st.luz};--halo:${st.luz}55"></span>
      </div>
      <div class="horarios">
        <div class="hbox"><div class="lbl">${t('entrada')} · ${t('previsto')}</div><div class="hh">${esc(v.entrada)}</div></div>
        <span class="harrow">→</span>
        <div class="hbox"><div class="lbl">${t('saida')} · ${t('previsto')}</div><div class="hh">${esc(v.saida)}</div></div>
      </div>
      <div class="estado" style="color:${st.luz}"><span class="ic">${st.ic}</span>${st.titulo}</div>
      <div class="estado-sub">${st.sub}</div>
      <div class="registro"><span class="rk">${t('real')}</span>
        <span class="rv ${v.confEntrada?'ok':''}">${v.confEntrada?fmtHora(v.confEntrada):'—'}</span>
        <span class="rarrow">→</span>
        <span class="rv ${v.confDescarga?'ok':''}">${v.confDescarga?fmtHora(v.confDescarga):'—'}</span>
      </div>
    </div>`; }).join('');
  $('foot').textContent=t('foot');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= App do motorista ================= */
function popularMotoristas(){ const sel=$('driverSelect');
  sel.innerHTML=cfg.motoristas.length?cfg.motoristas.map(n=>`<option>${esc(n)}</option>`).join(''):`<option value="">—</option>`; }
function entrarMotorista(){ const n=$('driverSelect').value; if(!n)return; motoristaAtual=n;
  $('driverLogin').classList.add('hidden');$('driverPanel').classList.remove('hidden');
  $('dNome').textContent=n;$('dAvatar').textContent=n[0].toUpperCase(); renderDriver(); }
function sairMotorista(){ motoristaAtual=null;$('driverPanel').classList.add('hidden');$('driverLogin').classList.remove('hidden'); }
function renderDriver(){ if(!motoristaAtual)return; const hoje=ymdHoje();
  const minhas=binsDoDia(hoje).filter(v=>v.motorista===motoristaAtual).sort((a,b)=>a.entrada.localeCompare(b.entrada));
  const pend=minhas.filter(v=>!v.confDescarga).length;
  $('dResumo').textContent=`${minhas.length} · ${pend} ${lang==='ja'?'未完了':'pendente(s)'}`;
  const wrap=$('driverTrips');
  if(!minhas.length){ wrap.innerHTML=`<div class="empty">${t('nenhuma_entrega')}</div>`; return; }
  wrap.innerHTML=minhas.map(v=>{ const st=estado(v);
    let acoes;
    if(!v.confEntrada) acoes=`<button class="btn verde" onclick="confirmarEntrada('${v.id}')">${t('confirmar_entrada')}</button>`;
    else if(!v.confDescarga) acoes=`<div class="done-stamp">${t('sub_entrou')} ${fmtHora(v.confEntrada)}</div><button class="btn azul" onclick="confirmarDescarga('${v.id}')">${t('confirmar_descarga')}</button>`;
    else acoes=`<div class="done-stamp">✔ ${fmtHora(v.confEntrada)} · ${fmtHora(v.confDescarga)}</div>`;
    return `<div class="trip-card ${st.cat}">
      <div class="trip-top"><div><div class="trip-title">${esc(v.linha)} · ${t('bin')} ${esc(v.bin)}</div>
        <div style="color:var(--muted);font-size:12px">${v.turno==='noite'?'🌙':'☀️'} ${esc(v.caminhao)}</div></div>
        <span class="pill ${st.cat}">${st.titulo}</span></div>
      <div class="trip-meta"><div><div class="k">${t('entrada')}</div><div class="val">${esc(v.entrada)}</div></div>
        <div><div class="k">${t('saida')}</div><div class="val">${esc(v.saida)}</div></div></div>
      <div class="trip-actions">${acoes}</div></div>`; }).join('');
}
function marcarConf(id,campo){ const d=ymdHoje(); confirmacoes[d]=confirmacoes[d]||{}; confirmacoes[d][id]=confirmacoes[d][id]||{};
  confirmacoes[d][id][campo]=Date.now(); salvar(); renderDriver(); }
function confirmarEntrada(id){ marcarConf(id,'confEntrada'); }
function confirmarDescarga(id){ const d=ymdHoje(); confirmacoes[d]=confirmacoes[d]||{}; confirmacoes[d][id]=confirmacoes[d][id]||{};
  if(!confirmacoes[d][id].confEntrada) confirmacoes[d][id].confEntrada=Date.now();
  confirmacoes[d][id].confDescarga=Date.now(); salvar(); renderDriver(); }

/* ================= Simular ao vivo ================= */
function simularAoVivo(){ const agora=new Date(); const hhmm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const ent=new Date(agora.getTime()+60000), sai=new Date(agora.getTime()+4*60000);
  const [Y,M,D]=ymdHoje().split('-').map(Number); const dow=new Date(Y,M-1,D).getDay();
  if(!cfg.linhas.includes('Yoshiwara'))cfg.linhas.push('Yoshiwara'); if(!cfg.motoristas.includes('Vini'))cfg.motoristas.push('Vini');
  const wk=weekKeyOf(ymdHoje()); escala[wk]=escala[wk]||[];
  escala[wk].unshift({id:uid(),linha:'Yoshiwara',bin:2,turno:'dia',entrada:hhmm(ent),saida:hhmm(sai),motorista:'Vini',caminhao:'ABC-1D23',dias:[dow]});
  selectedDate=ymdHoje(); salvar(); render();
  alert((lang==='ja'?'作成: 吉祥寺 · ビン2 · Vini ('+hhmm(ent)+'→'+hhmm(sai)+')\n\nドライバー→Vini→入場を確認。':'Criado: Yoshiwara · Bin 2 · Vini ('+hhmm(ent)+'→'+hhmm(sai)+').\n\nAbra 📱 Motorista → Vini → Confirmar entrada.')); }

  $('chipsCaminhoes').innerHTML=cfg.caminhoes.map((n,i)=>`<span class="chip">🚛 ${esc(n)}<span class="x" onclick="delCam(${i})">✕</span></span>`).join('')||'<span style="color:var(--muted);font-size:12px">—</span>';
}
function addLinha(){ const v=$('addLinhaInp').value.trim(); if(v&&!cfg.linhas.includes(v)){cfg.linhas.push(v);$('addLinhaInp').value='';salvar();renderProg();popularMotoristas();} }
function addMotorista(){ const v=$('addMotInp').value.trim(); if(v&&!cfg.motoristas.includes(v)){cfg.motoristas.push(v);$('addMotInp').value='';salvar();renderProg();popularMotoristas();} }
function addCaminhao(){ const v=$('addCamInp').value.trim(); if(v&&!cfg.caminhoes.includes(v)){cfg.caminhoes.push(v);$('addCamInp').value='';salvar();renderProg();} }
function delLinha(i){ cfg.linhas.splice(i,1);salvar();renderProg(); }
function delMot(i){ cfg.motoristas.splice(i,1);salvar();renderProg();popularMotoristas(); }
function delCam(i){ cfg.caminhoes.splice(i,1);salvar();renderProg(); }

function renderProg(){
  if(tab!=='prog') return;
  renderChips();
  const loc=lang==='ja'?'ja-JP':'pt-BR';
  const dates=weekDates(selectedWeek);
  const d0=quando(dates[0],'00:00'), d6=quando(dates[6],'00:00');
  $('wkLabel').innerHTML=`${t('semana')} ${d0.toLocaleDateString(loc,{day:'2-digit',month:'short'})} – ${d6.toLocaleDateString(loc,{day:'2-digit',month:'short'})}<small>${selectedWeek}</small>`;
  $('weekPick').value=selectedWeek;
  const ed=$('progEditor');
  if(!cfg.linhas.length){ ed.innerHTML=`<div class="empty">${t('nenhuma_linha_cad')}</div>`; return; }
  const arr=escala[selectedWeek]||[];
  ed.innerHTML=cfg.linhas.map(linha=>{
    const daG=arr.filter(a=>a.linha===linha&&a.turno==='dia');
    const noG=arr.filter(a=>a.linha===linha&&a.turno==='noite');
    return `<div class="lineblock">
      <h3>📍 ${esc(linha)}</h3>
      ${shiftBlock(linha,'dia',daG)}
      ${shiftBlock(linha,'noite',noG)}
    </div>`;
  }).join('');
}
function shiftBlock(linha,turno,arr){
  const icon=turno==='dia'?'☀️':'🌙'; const nome=turno==='dia'?t('turno_dia'):t('turno_noite');
  const head=`<div class="asgn-head"><div>${t('bin')}</div><div>${t('entrada')}</div><div>${t('saida')}</div><div>${t('mot')}</div><div>${t('cam')}</div><div></div></div>`;
  const rows=arr.map(a=>{
    const mopts=cfg.motoristas.map(m=>`<option ${m===a.motorista?'selected':''}>${esc(m)}</option>`).join('');
    const copts=cfg.caminhoes.map(c=>`<option ${c===a.caminhao?'selected':''}>${esc(c)}</option>`).join('');
    return `<div class="asgn">
      <input type="number" value="${esc(a.bin)}" onchange="updAsgn('${a.id}','bin',this.value)">
      <input type="time" value="${esc(a.entrada)}" onchange="updAsgn('${a.id}','entrada',this.value)">
      <input type="time" value="${esc(a.saida)}" onchange="updAsgn('${a.id}','saida',this.value)">
      <select onchange="updAsgn('${a.id}','motorista',this.value)">${mopts}</select>
      <select onchange="updAsgn('${a.id}','caminhao',this.value)">${copts}</select>
      <button class="rm" onclick="delAsgn('${a.id}')">✕</button>
    </div>`; }).join('');
  return `<div class="shift ${turno}"><div class="shift-h">${icon} ${nome}</div>${arr.length?head:''}${rows}
    <button class="btn ghost small" onclick="addAsgn('${esc(linha)}','${turno}')">${t('add_bin')}</button></div>`;
}
function addAsgn(linha,turno){ escala[selectedWeek]=escala[selectedWeek]||[];
  const def=turno==='dia'?['07:00','07:30']:['22:00','23:00'];
  escala[selectedWeek].push({id:uid(),linha,bin:1,turno,entrada:def[0],saida:def[1],
    motorista:cfg.motoristas[0]||'',caminhao:cfg.caminhoes[0]||'',dias:[1,2,3,4,5,6]});
  salvar(); renderProg(); }
function updAsgn(id,campo,val){ const arr=escala[selectedWeek]||[]; const a=arr.find(x=>x.id===id); if(!a)return;
  a[campo]=(campo==='bin')?val:val; salvar(); if(tab==='painel')render(); }
function delAsgn(id){ escala[selectedWeek]=(escala[selectedWeek]||[]).filter(x=>x.id!==id); salvar(); renderProg(); }

function replicarProx(){ const src=escala[selectedWeek]||[]; if(!src.length){alert(lang==='ja'?'この週は空です。':'Esta semana está vazia.');return;}
  const next=addDaysStr(selectedWeek,7); escala[next]=src.map(a=>({...a,id:uid()})); salvar();
  alert(lang==='ja'?'翌週に複製しました。':'Replicado para a próxima semana.'); }
function expandirSemanas(){ const src=escala[selectedWeek]||[]; if(!src.length){alert(lang==='ja'?'この週は空です。':'Esta semana está vazia.');return;}
  abrirModal(t('expandir'), t('prompt_expandir'), 4, (n)=>{ n=Math.max(1,Math.min(52,parseInt(n)||1));
    for(let i=1;i<=n;i++){ const wk=addDaysStr(selectedWeek,7*i); escala[wk]=src.map(a=>({...a,id:uid()})); }
    salvar(); alert((lang==='ja'?'':'')+n+(lang==='ja'?'週に展開しました。':' semana(s) preenchida(s).')); }); }
function trocarTurnos(){ const arr=escala[selectedWeek]||[]; if(!arr.length){alert(lang==='ja'?'この週は空です。':'Esta semana está vazia.');return;}
  cfg.linhas.forEach(linha=>{
    const dia=arr.filter(a=>a.linha===linha&&a.turno==='dia').sort((a,b)=>a.bin-b.bin);
    const noite=arr.filter(a=>a.linha===linha&&a.turno==='noite').sort((a,b)=>a.bin-b.bin);
    const n=Math.min(dia.length,noite.length);
    for(let i=0;i<n;i++){ const m=dia[i].motorista; dia[i].motorista=noite[i].motorista; noite[i].motorista=m; }
  });
  salvar(); renderProg(); if(tab==='painel')render();
  alert(lang==='ja'?'シフトを交代しました（日勤↔夜勤）。':'Turnos trocados (dia ↔ noite).'); }

/* modal (expandir) */
let modalCb=null;
function abrirModal(titulo,label,val,cb){ $('modalTitle').textContent=titulo;$('modalLabel').textContent=label;$('modalInput').value=val;
  modalCb=cb; $('overlay').classList.add('open'); }
function fecharModal(){ $('overlay').classList.remove('open'); modalCb=null; }

/* ================= Tabs / modo ================= */
function setTab(tb){ tab=tb; $('tabPainel').classList.toggle('active',tb==='painel');$('tabProg').classList.toggle('active',tb==='prog');
  $('viewPainel').classList.toggle('hidden',tb!=='painel');$('viewProg').classList.toggle('hidden',tb!=='prog');
  if(tb==='painel')render(); else renderProg(); }
function setMode(m){ mode=m; $('btnCoord').classList.toggle('active',m==='coord');$('btnDriver').classList.toggle('active',m==='driver');
  $('modeCoord').classList.toggle('hidden',m!=='coord');$('modeDriver').classList.toggle('hidden',m!=='driver');
  if(m==='driver')popularMotoristas(); render(); }

/* ================= Boot ================= */
(function init(){
  const savedLang=store.get(LS_LANG); if(savedLang==='ja'||savedLang==='pt')lang=savedLang;
  const tv=store.get(LS_TOL); if(tv!==null)$('tol').value=tv;
  selectedDate=ymdHoje(); selectedWeek=weekKeyOf(ymdHoje());
  carregar(); popularMotoristas();
  aplicarIdioma();               // aplica textos e chama render/renderProg
  tick(); setInterval(tick,1000);
  $('modalOk').addEventListener('click',()=>{ const v=$('modalInput').value; const cb=modalCb; fecharModal(); if(cb)cb(v); });
  $('overlay').addEventListener('click',e=>{ if(e.target===$('overlay'))fecharModal(); });
})();
</script>
</body>
